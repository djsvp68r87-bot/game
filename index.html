<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Raycast Arena</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
      font-family: "Courier New", monospace; touch-action:none; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated;
      image-rendering: crisp-edges; }

  /* HUD — ретро, без эмодзи */
  #hud { position:fixed; left:0; right:0; top:0;
      padding: calc(6px + env(safe-area-inset-top)) 12px 6px;
      display:flex; justify-content:space-between; gap:8px;
      pointer-events:none; z-index:5;
      font-family: "Courier New", monospace; font-weight:900; }
  .hud-item {
      display:flex; align-items:center; gap:8px;
      padding:6px 12px;
      background: rgba(0,0,0,0.65);
      border:2px solid currentColor;
      font-size:14px; letter-spacing:2px;
      box-shadow: 0 0 12px currentColor, inset 0 0 8px rgba(0,0,0,0.6); }
  .hud-item .label { font-size:11px; opacity:0.65; letter-spacing:1px; }
  .hud-item .val { font-size:16px; }
  .hud-hp { color:#ff4444; }
  .hud-am { color:#66ddff; }
  .hud-sc { color:#88ff88; }

  /* FIRE button — квадратный, ретро */
  #fire { position:fixed; right: calc(20px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      width:96px; height:96px;
      background: rgba(180,20,20,0.85);
      border:3px solid #ff5555;
      color:#fff; font-family:"Courier New", monospace;
      font-size:14px; font-weight:900; letter-spacing:2px;
      display:flex; align-items:center; justify-content:center;
      z-index:10;
      box-shadow: 0 0 24px rgba(255,50,50,0.7), inset 0 0 12px rgba(0,0,0,0.5); }
  #fire:active { background: rgba(255,40,40,1); transform:scale(0.94); }

  /* Джойстик */
  #joy-base { position:fixed;
      left: calc(20px + env(safe-area-inset-left));
      bottom: calc(20px + env(safe-area-inset-bottom));
      width:130px; height:130px;
      background: rgba(255,255,255,0.05);
      border:2px solid rgba(255,255,255,0.22);
      z-index:10; pointer-events:none; }
  #joy-stick { position:absolute; left:50%; top:50%;
      width:54px; height:54px; margin:-27px 0 0 -27px;
      background: rgba(255,215,60,0.7);
      border:2px solid rgba(255,255,255,0.5);
      box-shadow: 0 0 16px rgba(255,200,60,0.6); }

  /* Прицел */
  #cross { position:fixed; left:50%; top:50%; width:24px; height:24px;
      margin:-12px 0 0 -12px; z-index:5; pointer-events:none; }
  #cross::before, #cross::after {
      content:''; position:absolute; background:#ffcc00;
      box-shadow:0 0 6px #000, 0 0 4px #ff8800; }
  #cross::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #cross::after  { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }

  /* Вспышка выстрела */
  #flash { position:fixed; inset:0; background:#ffe0a0;
      opacity:0; pointer-events:none; z-index:6; }

  /* Красный экран при уроне */
  #hurt { position:fixed; inset:0; pointer-events:none; z-index:7;
      background: radial-gradient(ellipse at center,
          transparent 30%, rgba(180,0,0,0.85) 100%);
      opacity:0; transition: opacity 0.4s ease-out; }

  /* Смерть */
  #dead { position:fixed; inset:0; display:none;
      flex-direction:column; align-items:center; justify-content:center;
      background: rgba(40,0,0,0.9); color:#fff; z-index:20;
      text-align:center; font-family:"Courier New", monospace; }
  #dead h1 { font-size:44px; color:#ff3344; margin-bottom:18px;
      letter-spacing:8px; font-weight:900;
      text-shadow:0 0 30px #ff0000, 0 0 8px #ff0000; }
  #dead .stat { font-size:22px; color:#ffcc00; letter-spacing:4px; margin:6px 0; }
  #dead small { opacity:0.55; margin-top:26px; font-size:13px; letter-spacing:2px; }

  /* Стартовый экран */
  #start { position:fixed; inset:0; z-index:30;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#05050a; color:#fff; text-align:center; padding:20px;
      font-family:"Courier New", monospace; }
  #start h1 { font-size:38px; color:#ffcc00; letter-spacing:8px;
      margin-bottom:6px; font-weight:900;
      text-shadow:0 0 24px #ff8800, 0 0 6px #ffcc00; }
  #start h2 { font-size:14px; color:#ff6644; letter-spacing:4px;
      margin-bottom:26px; opacity:0.85; }
  #start .info { opacity:0.9; line-height:1.9; font-size:13px;
      max-width:440px; letter-spacing:1px; }
  #start .info b { color:#ffcc00; }
  #start button { margin-top:26px; padding:14px 46px;
      background:#ffcc00; color:#000; font-family:"Courier New", monospace;
      font-weight:900; font-size:16px; letter-spacing:4px;
      border:none; cursor:pointer;
      box-shadow:0 0 20px rgba(255,200,0,0.6); }
  #start button:active { background:#fff; }

  /* Повернуть телефон */
  #rotate { position:fixed; inset:0; background:#05050a; color:#ffcc00;
      display:none; align-items:center; justify-content:center;
      flex-direction:column; z-index:100;
      font-family:"Courier New", monospace;
      font-size:20px; font-weight:900; letter-spacing:3px;
      text-align:center; padding:20px; }
  #rotate .box { width:70px; height:120px; border:3px solid #ffcc00;
      margin-bottom:24px; animation: rot 2s ease-in-out infinite;
      box-shadow: 0 0 20px #ff8800; }
  @keyframes rot { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="hud-item hud-hp"><span class="label">HEALTH</span><span class="val" id="hp">100</span></div>
  <div class="hud-item hud-am"><span class="label">AMMO</span><span class="val">INF</span></div>
  <div class="hud-item hud-sc"><span class="label">KILLS</span><span class="val" id="sc">0</span></div>
</div>

<div id="cross"></div>
<div id="flash"></div>
<div id="hurt"></div>
<div id="joy-base"><div id="joy-stick"></div></div>
<div id="fire">FIRE</div>

<div id="dead">
  <h1>YOU DIED</h1>
  <div class="stat">KILLS: <span id="dsc">0</span></div>
  <small>TAP TO RESTART</small>
</div>

<div id="rotate">
  <div class="box"></div>
  ROTATE DEVICE<br>TO LANDSCAPE
</div>

<div id="start">
  <h1>RAYCAST ARENA</h1>
  <h2>— SURVIVE THE HORDE —</h2>
  <div class="info">
    <b>LEFT SIDE</b> — movement joystick<br>
    <b>SWIPE CENTER</b> — turn camera<br>
    <b>RED BUTTON</b> — fire (infinite ammo)<br>
    Kill monsters before they reach you
  </div>
  <button id="go">START GAME</button>
</div>

<script>
(function(){
"use strict";

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', { alpha: false });

// ============ MAP ============
var MAP_STR = [
  "################################",
  "#..............................#",
  "#....###.......###.......###...#",
  "#....#.#.......#.#.......#.#...#",
  "#....#.#.......#.#.......#.#...#",
  "#....###.......###.......###...#",
  "#..............................#",
  "#....###.......###.......###...#",
  "#....#.#.......#.#.......#.#...#",
  "#....#.#.......#.#.......#.#...#",
  "#....###.......###.......###...#",
  "#..............................#",
  "#..###...###...###...###...###.#",
  "#..#.......#...........#....#..#",
  "#..#.......#...........#....#..#",
  "#..###...###...###...###...###.#",
  "#..............................#",
  "#....#####.....#####....#####..#",
  "#....#...#.....#...#....#...#..#",
  "#....#...#.....#...#....#...#..#",
  "#....#####.....#####....#####..#",
  "#..............................#",
  "#..###...###...###...###...###.#",
  "#..#.......#...........#....#..#",
  "#..#.......#...........#....#..#",
  "#..###...###...###...###...###.#",
  "#..............................#",
  "#....###.......###.......###...#",
  "#....#.#.......#.#.......#.#...#",
  "#....###.......###.......###...#",
  "#..............................#",
  "################################"
];

var MAP = [], MAP_W = 0, MAP_H = 0;
(function(){
  var maxW = 0;
  for (var i = 0; i < MAP_STR.length; i++) if (MAP_STR[i].length > maxW) maxW = MAP_STR[i].length;
  MAP_H = MAP_STR.length; MAP_W = maxW;
  for (var y = 0; y < MAP_H; y++) {
    var row = [];
    for (var x = 0; x < MAP_W; x++) {
      var ch = MAP_STR[y].charAt(x);
      row.push(ch === '#' ? 1 : 0);
    }
    MAP.push(row);
  }
})();

function isWall(x, y) {
  var mx = Math.floor(x), my = Math.floor(y);
  if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H) return true;
  return MAP[my][mx] === 1;
}

// ============ AUDIO ============
var AC = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}

function tone(freq, type, dur, vol, freqEnd) {
  if (!AC) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}

function noise(dur, vol, filterFreq) {
  if (!AC) return;
  try {
    var t0 = AC.currentTime;
    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var flt = AC.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.value = filterFreq || 1200;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}

function sndGun() {
  tone(240, 'square', 0.09, 0.18, 40);
  noise(0.12, 0.20, 1400);
}
function sndHit() {
  tone(500, 'square', 0.06, 0.14, 220);
  noise(0.06, 0.10, 2000);
}
function sndDeath() {
  tone(180, 'sawtooth', 0.5, 0.22, 30);
  noise(0.4, 0.12, 600);
}
function sndHurt() {
  tone(90, 'square', 0.35, 0.22, 40);
  noise(0.2, 0.15, 500);
}
function sndGrowl() {
  tone(50 + Math.random() * 30, 'sawtooth', 0.7, 0.06, 25);
}

// ============ STATE ============
var state = {
  px: 3.5, py: 3.5, dir: 0,
  fov: Math.PI / 2.6,
  hp: 100, score: 0, dead: false,
  enemies: [], blood: [], particles: [],
  running: false, bob: 0,
  hurtFlash: 0,
  pistolKick: 0,
  muzzleFlash: 0
};

function reset() {
  state.px = 3.5; state.py = 3.5; state.dir = 0;
  state.hp = 100; state.score = 0; state.dead = false;
  state.enemies = []; state.blood = []; state.particles = [];
  state.hurtFlash = 0; state.pistolKick = 0; state.muzzleFlash = 0;
  spawnEnemies(8);
  document.getElementById('hp').textContent = '100';
  document.getElementById('sc').textContent = '0';
  document.getElementById('dead').style.display = 'none';
}

function findFreeCell() {
  for (var t = 0; t < 800; t++) {
    var x = 1.5 + Math.random() * (MAP_W - 3);
    var y = 1.5 + Math.random() * (MAP_H - 3);
    if (!isWall(x, y) && Math.hypot(x - state.px, y - state.py) > 6) {
      // Check no wall too close
      if (!isWall(x + 0.3, y) && !isWall(x - 0.3, y) &&
          !isWall(x, y + 0.3) && !isWall(x, y - 0.3)) {
        return { x: x, y: y };
      }
    }
  }
  return { x: 8, y: 8 };
}

function spawnEnemies(n) {
  for (var i = 0; i < n; i++) {
    var p = findFreeCell();
    state.enemies.push({
      x: p.x, y: p.y, hp: 30, alive: true,
      lastAttack: 0,
      wobble: Math.random() * 6.28,
      frame: 0, frameTimer: 0,
      growlTimer: 2 + Math.random() * 6,
      deathTimer: 0
    });
  }
}

// ============ CANVAS ============
var W = 0, H = 0;
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 1.3);
  W = cv.width  = Math.floor(window.innerWidth  * dpr);
  H = cv.height = Math.floor(window.innerHeight * dpr);
  cv.style.width  = window.innerWidth + 'px';
  cv.style.height = window.innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
  var portrait = window.innerHeight > window.innerWidth;
  document.getElementById('rotate').style.display = portrait ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

// ============ INPUT ============
var keys = { w:0, a:0, s:0, d:0 };

var joy = {
  active: false, id: null,
  cx: 0, cy: 0, dx: 0, dy: 0,
  baseEl: document.getElementById('joy-base'),
  stickEl: document.getElementById('joy-stick')
};
function updateJoyBase() {
  var r = joy.baseEl.getBoundingClientRect();
  joy.cx = r.left + r.width / 2;
  joy.cy = r.top + r.height / 2;
}
function setStick(x, y) {
  joy.stickEl.style.left = (50 + x * 50) + '%';
  joy.stickEl.style.top  = (50 + y * 50) + '%';
}

var look = { active: false, id: null, lastX: 0 };

cv.addEventListener('touchstart', function(e){
  if (state.dead) return;
  updateJoyBase();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var x = t.clientX, y = t.clientY;
    if (!joy.active && x < window.innerWidth * 0.5 && y > window.innerHeight * 0.5) {
      joy.active = true; joy.id = t.identifier;
      joy.dx = 0; joy.dy = 0; setStick(0, 0); continue;
    }
    if (!look.active) {
      look.active = true; look.id = t.identifier; look.lastX = x;
    }
  }
  e.preventDefault();
}, { passive: false });

cv.addEventListener('touchmove', function(e){
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (joy.active && t.identifier === joy.id) {
      var dx = t.clientX - joy.cx, dy = t.clientY - joy.cy;
      var len = Math.hypot(dx, dy), maxR = 60;
      var nx = len > maxR ? dx / len : dx / maxR;
      var ny = len > maxR ? dy / len : dy / maxR;
      joy.dx = nx; joy.dy = ny; setStick(nx, ny);
    }
    if (look.active && t.identifier === look.id) {
      var lx = t.clientX - look.lastX;
      look.lastX = t.clientX;
      state.dir += lx * 0.007;
    }
  }
  e.preventDefault();
}, { passive: false });

function endTouch(e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (joy.active && t.identifier === joy.id) {
      joy.active = false; joy.id = null;
      joy.dx = 0; joy.dy = 0; setStick(0, 0);
    }
    if (look.active && t.identifier === look.id) {
      look.active = false; look.id = null;
    }
  }
  e.preventDefault();
}
cv.addEventListener('touchend', endTouch, { passive: false });
cv.addEventListener('touchcancel', endTouch, { passive: false });

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (k in keys) keys[k] = 1;
  if (k === ' ') fire();
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if (k in keys) keys[k] = 0;
});

var fireBtn = document.getElementById('fire');
fireBtn.addEventListener('touchstart', function(e){ fire(); e.preventDefault(); }, { passive: false });
fireBtn.addEventListener('mousedown', function(e){ fire(); e.preventDefault(); });

document.getElementById('dead').addEventListener('touchstart', function(e){
  if (state.dead) { reset(); state.running = true; e.preventDefault(); }
}, { passive: false });

document.getElementById('go').addEventListener('click', function(){
  initAudio();
  document.getElementById('start').style.display = 'none';
  resize(); reset(); state.running = true;
  requestAnimationFrame(mainLoop);
});

// ============ SHOOTING ============
function fire() {
  if (state.dead || !state.running) return;

  sndGun();
  state.pistolKick = 1;
  state.muzzleFlash = 1;

  var flash = document.getElementById('flash');
  flash.style.transition = 'none';
  flash.style.opacity = '0.22';
  requestAnimationFrame(function(){
    flash.style.transition = 'opacity 0.12s';
    flash.style.opacity = '0';
  });

  var dx = Math.cos(state.dir), dy = Math.sin(state.dir);
  var hit = null, hitDist = Infinity;

  for (var i = 0; i < state.enemies.length; i++) {
    var en = state.enemies[i];
    if (!en.alive) continue;
    var ex = en.x - state.px, ey = en.y - state.py;
    var proj = ex * dx + ey * dy;
    if (proj < 0) continue;
    var perp = Math.abs(ex * dy - ey * dx);
    if (perp < 0.42 && proj < hitDist && !wallBetween(state.px, state.py, en.x, en.y)) {
      hitDist = proj; hit = en;
    }
  }

  if (hit) {
    sndHit();
    hit.hp -= 15;
    // Кровь
    spawnBlood(hit.x, hit.y, 6 + Math.floor(Math.random() * 4));
    if (hit.hp <= 0) {
      hit.alive = false;
      hit.deathTimer = 0;
      state.score++;
      document.getElementById('sc').textContent = state.score;
      sndDeath();
      spawnBlood(hit.x, hit.y, 16);
      setTimeout(function(){
        if (!state.dead) {
          var p = findFreeCell();
          state.enemies.push({
            x: p.x, y: p.y, hp: 30, alive: true,
            lastAttack: 0, wobble: Math.random() * 6.28,
            frame: 0, frameTimer: 0,
            growlTimer: 3 + Math.random() * 5,
            deathTimer: 0
          });
        }
      }, 2600);
    }
  }
}

function wallBetween(x1, y1, x2, y2) {
  var steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) * 8);
  for (var i = 1; i < steps; i++) {
    var t = i / steps;
    if (isWall(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return true;
  }
  return false;
}

function spawnBlood(x, y, n) {
  for (var i = 0; i < n; i++) {
    var ang = Math.random() * Math.PI * 2;
    var spd = 0.5 + Math.random() * 1.5;
    state.particles.push({
      x: x, y: y, z: 0.5 + Math.random() * 0.3,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      vz: 1 + Math.random() * 2,
      life: 0.8 + Math.random() * 0.6,
      maxLife: 1.4,
      color: Math.random() > 0.5 ? '#aa0000' : '#cc1111',
      size: 0.06 + Math.random() * 0.08
    });
  }
  // Затяжка крови на полу
  if (state.blood.length > 40) state.blood.shift();
  state.blood.push({ x: x, y: y, r: 0.25 + Math.random() * 0.2, alpha: 0.65 });
}

function playerHurt(dmg) {
  state.hp -= dmg;
  state.hurtFlash = 1;
  sndHurt();
  document.getElementById('hp').textContent = Math.max(0, state.hp);
  if (state.hp <= 0) {
    state.hp = 0; state.dead = true;
    document.getElementById('dsc').textContent = state.score;
    document.getElementById('dead').style.display = 'flex';
  }
}

// ============ UPDATE ============
var MOVE_SPEED = 1.7;

function update(dt) {
  if (state.dead || !state.running) return;

  // Flash эффекты
  state.pistolKick *= Math.max(0, 1 - dt * 8);
  state.muzzleFlash *= Math.max(0, 1 - dt * 12);
  state.hurtFlash *= Math.max(0, 1 - dt * 2);

  var hurt = document.getElementById('hurt');
  hurt.style.opacity = (state.hurtFlash * 0.85).toFixed(3);

  // Движение
  var mx = 0, my = 0;
  if (joy.active) { mx = joy.dx; my = joy.dy; }
  if (keys.w) my -= 1;
  if (keys.s) my += 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;

  var len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }

  if (len > 0.05) {
    var cos = Math.cos(state.dir), sin = Math.sin(state.dir);
    var fx = -my * cos + mx * -sin;
    var fy = -my * sin + mx *  cos;
    var nx = state.px + fx * MOVE_SPEED * dt;
    var ny = state.py + fy * MOVE_SPEED * dt;
    if (!isWall(nx, state.py)) state.px = nx;
    if (!isWall(state.px, ny)) state.py = ny;
    state.bob += dt * 6;
  } else state.bob *= 0.9;

  // Враги
  for (var i = 0; i < state.enemies.length; i++) {
    var en = state.enemies[i];
    if (!en.alive) continue;

    en.wobble += dt * 3;
    en.frameTimer += dt;
    if (en.frameTimer > 0.22) { en.frameTimer = 0; en.frame = (en.frame + 1) % 2; }

    // Случайное рычание
    en.growlTimer -= dt;
    if (en.growlTimer <= 0) {
      en.growlTimer = 4 + Math.random() * 8;
      var d2 = Math.hypot(en.x - state.px, en.y - state.py);
      if (d2 < 7) sndGrowl();
    }

    var dx = state.px - en.x, dy = state.py - en.y;
    var dist = Math.hypot(dx, dy);
    if (dist < 0.001) continue;

    if (dist < 9 && !wallBetween(en.x, en.y, state.px, state.py)) {
      var speed = 0.95;
      var nx2 = en.x + (dx / dist) * speed * dt;
      var ny2 = en.y + (dy / dist) * speed * dt;
      if (!isWall(nx2, en.y)) en.x = nx2;
      if (!isWall(en.x, ny2)) en.y = ny2;

      if (dist < 0.85) {
        en.lastAttack += dt;
        if (en.lastAttack > 0.9) {
          en.lastAttack = 0;
          playerHurt(6);
        }
      } else en.lastAttack = 0;
    }
  }

  // Частицы крови
  for (var p = state.particles.length - 1; p >= 0; p--) {
    var pt = state.particles[p];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vz -= 9 * dt;
    pt.z += pt.vz * dt;
    pt.life -= dt;
    if (pt.z < 0) { pt.z = 0; pt.vz *= -0.2; pt.vx *= 0.5; pt.vy *= 0.5; }
    if (pt.life <= 0) state.particles.splice(p, 1);
  }

  // Затяжка крови тускнеет со временем
  for (var b = 0; b < state.blood.length; b++) {
    state.blood[b].alpha *= (1 - dt * 0.05);
  }
  // Ограничение
  if (state.particles.length > 300) state.particles.splice(0, state.particles.length - 300);
}

// ============ RENDER ============
var zbufArr = null;
var zbufLen = 0;

// Простая текстура кирпича
function wallTex(u, v, side) {
  // u: [0,1] по горизонтали, v: [0,1] по вертикали
  var brickH = 0.25;
  var brickW = 0.5;
  var row = Math.floor(v / brickH);
  var offset = (row % 2) * (brickW / 2);
  var bx = ((u + offset) % 1 + 1) % 1;
  var mortarH = (v / brickH - Math.floor(v / brickH)) < 0.06;
  var mortarV = ((bx / brickW) - Math.floor(bx / brickW)) < 0.05;

  if (mortarH || mortarV) {
    return [55, 45, 40];
  }
  var seed = (row * 7 + Math.floor(bx / brickW) * 13) % 5;
  var shade = 0.85 + seed * 0.05;
  var baseR = side === 0 ? 155 : 130;
  var baseG = side === 0 ? 85 : 72;
  var baseB = side === 0 ? 55 : 48;
  return [
    Math.floor(baseR * shade),
    Math.floor(baseG * shade),
    Math.floor(baseB * shade)
  ];
}

function render() {
  var FOV = state.fov;
  var halfFOV = FOV / 2;
  var rayCount = Math.min(W, 420);
  var colW = W / rayCount;

  var bobY = Math.sin(state.bob) * 3;
  var horizon = H / 2 + bobY;

  // Потолок — градиент
  var ceilGrad = ctx.createLinearGradient(0, 0, 0, horizon);
  ceilGrad.addColorStop(0, '#08080f');
  ceilGrad.addColorStop(1, '#1a1a28');
  ctx.fillStyle = ceilGrad;
  ctx.fillRect(0, 0, W, horizon);

  // Пол — градиент
  var floorGrad = ctx.createLinearGradient(0, horizon, 0, H);
  floorGrad.addColorStop(0, '#12121a');
  floorGrad.addColorStop(1, '#28283a');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, horizon, W, H - horizon);

  // Пол — горизонтальные линии (эффект текстуры)
  for (var fy = horizon + 4; fy < H; fy += 6) {
    var dist = (H / 2) / (fy - horizon + 0.001);
    var a = Math.max(0, 0.12 - dist * 0.008);
    if (a > 0.01) {
      ctx.fillStyle = 'rgba(70,60,85,' + a.toFixed(3) + ')';
      ctx.fillRect(0, fy, W, 1);
    }
  }

  if (!zbufArr || zbufLen !== rayCount) {
    zbufArr = new Float32Array(rayCount);
    zbufLen = rayCount;
  }
  var zbuf = zbufArr;

  // ===== СТЕНЫ =====
  for (var i = 0; i < rayCount; i++) {
    var angle = state.dir - halfFOV + (i / rayCount) * FOV;
    var rayDx = Math.cos(angle), rayDy = Math.sin(angle);
    var mapX = Math.floor(state.px), mapY = Math.floor(state.py);
    var deltaX = Math.abs(1 / rayDx), deltaY = Math.abs(1 / rayDy);
    var stepX, stepY, sideDistX, sideDistY;
    if (rayDx < 0) { stepX = -1; sideDistX = (state.px - mapX) * deltaX; }
    else           { stepX =  1; sideDistX = (mapX + 1 - state.px) * deltaX; }
    if (rayDy < 0) { stepY = -1; sideDistY = (state.py - mapY) * deltaY; }
    else           { stepY =  1; sideDistY = (mapY + 1 - state.py) * deltaY; }

    var side = 0, hitWall = false;
    for (var s = 0; s < 80 && !hitWall; s++) {
      if (sideDistX < sideDistY) { sideDistX += deltaX; mapX += stepX; side = 0; }
      else                       { sideDistY += deltaY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= MAP_H) { hitWall = true; break; }
      if (MAP[mapY][mapX] === 1) hitWall = true;
    }

    var dist = side === 0 ? sideDistX - deltaX : sideDistY - deltaY;
    if (dist < 0.001) dist = 0.001;
    zbuf[i] = dist;

    var corrected = dist * Math.cos(angle - state.dir);
    var lineH = Math.min(H * 2, H / corrected);
    var y0 = horizon - lineH / 2;
    var y1 = horizon + lineH / 2;

    // Текстурная координата U
    var wallX;
    if (side === 0) wallX = state.py + dist * rayDy;
    else            wallX = state.px + dist * rayDx;
    wallX -= Math.floor(wallX);

    // 3 полосы: верх-подсветка, центр, низ-тень
    var baseColor = wallTex(wallX, 0.5, side);
    var fog = Math.min(1, corrected / 14);
    var fogMul = 1 - fog * 0.88;

    var r0 = Math.floor(baseColor[0] * 1.15 * fogMul);
    var g0 = Math.floor(baseColor[1] * 1.15 * fogMul);
    var b0 = Math.floor(baseColor[2] * 1.15 * fogMul);
    if (r0 > 255) r0 = 255; if (g0 > 255) g0 = 255; if (b0 > 255) b0 = 255;

    var px = i * colW;
    var pw = colW + 1;
    var topH = (y1 - y0) * 0.12;
    var midH = (y1 - y0) * 0.72;

    // Верхняя подсветка
    ctx.fillStyle = 'rgb(' + r0 + ',' + g0 + ',' + b0 + ')';
    ctx.fillRect(px, y0, pw, topH);

    // Центр
    ctx.fillStyle = 'rgb(' +
      Math.floor(baseColor[0] * fogMul) + ',' +
      Math.floor(baseColor[1] * fogMul) + ',' +
      Math.floor(baseColor[2] * fogMul) + ')';
    ctx.fillRect(px, y0 + topH, pw, midH);

    // Низ-тень
    ctx.fillStyle = 'rgb(' +
      Math.floor(baseColor[0] * 0.55 * fogMul) + ',' +
      Math.floor(baseColor[1] * 0.55 * fogMul) + ',' +
      Math.floor(baseColor[2] * 0.55 * fogMul) + ')';
    ctx.fillRect(px, y0 + topH + midH, pw, (y1 - y0) - topH - midH);
  }

  // ===== КРОВЬ НА ПОЛУ =====
  for (var bi = 0; bi < state.blood.length; bi++) {
    var bl = state.blood[bi];
    var bdx = bl.x - state.px, bdy = bl.y - state.py;
    var bAng = Math.atan2(bdy, bdx) - state.dir;
    while (bAng > Math.PI) bAng -= Math.PI * 2;
    while (bAng < -Math.PI) bAng += Math.PI * 2;
    if (Math.abs(bAng) > state.fov) continue;
    var bCorr = Math.hypot(bdx, bdy) * Math.cos(bAng);
    if (bCorr < 0.3) continue;
    var sizeH = Math.min(H * 2, H / bCorr);
    var screenX = W / 2 + Math.tan(bAng) * (W / 2) / Math.tan(state.fov / 2);
    var floorY = horizon + (H / bCorr) / 2;
    var size = sizeH * bl.r;
    ctx.globalAlpha = bl.alpha;
    ctx.fillStyle = '#3a0000';
    ctx.beginPath();
    ctx.ellipse(screenX, floorY, size * 0.5, size * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6a0000';
    ctx.beginPath();
    ctx.ellipse(screenX, floorY, size * 0.3, size * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ===== СПРАЙТЫ ВРАГОВ =====
  var sprites = [];
  for (var k = 0; k < state.enemies.length; k++) {
    var e = state.enemies[k];
    if (!e.alive) continue;
    var ddx = e.x - state.px, ddy = e.y - state.py;
    sprites.push({ x: e.x, y: e.y, dist: Math.hypot(ddx, ddy), enemy: e });
  }
  sprites.sort(function(a, b){ return b.dist - a.dist; });

  for (var si = 0; si < sprites.length; si++) {
    drawSprite(sprites[si], horizon, colW, rayCount, zbuf);
  }

  // ===== ЧАСТИЦЫ КРОВИ =====
  for (var pi = 0; pi < state.particles.length; pi++) {
    var p = state.particles[pi];
    var pdx = p.x - state.px, pdy = p.y - state.py;
    var pangle = Math.atan2(pdy, pdx) - state.dir;
    while (pangle > Math.PI) pangle -= Math.PI * 2;
    while (pangle < -Math.PI) pangle += Math.PI * 2;
    if (Math.abs(pangle) > state.fov) continue;
    var pcorr = Math.hypot(pdx, pdy) * Math.cos(pangle);
    if (pcorr < 0.2) continue;
    var col = Math.floor((pcorr) / colW);
    if (col < 0 || col >= rayCount) continue;
    // Проверка z-буфера
    if (zbuf[col] < pcorr) continue;
    var psize = Math.min(H * 2, H / pcorr);
    var psx = W / 2 + Math.tan(pangle) * (W / 2) / Math.tan(state.fov / 2);
    var psy = horizon + (H / pcorr) / 2 - (p.z * H / pcorr);
    ctx.globalAlpha = Math.min(1, p.life / 0.4);
    ctx.fillStyle = p.color;
    var sz = psize * p.size;
    if (sz < 1) sz = 1;
    ctx.fillRect(psx - sz/2, psy - sz/2, sz, sz);
    ctx.globalAlpha = 1;
  }

  drawGun();
}

function drawSprite(sp, horizon, colW, rayCount, zbuf) {
  var dx = sp.x - state.px, dy = sp.y - state.py;
  var angle = Math.atan2(dy, dx) - state.dir;
  while (angle > Math.PI) angle -= Math.PI * 2;
  while (angle < -Math.PI) angle += Math.PI * 2;
  if (Math.abs(angle) > state.fov) return;

  var corrected = sp.dist * Math.cos(angle);
  if (corrected < 0.25) return;

  var sizeH = Math.min(H * 2, H / corrected);
  var sizeW = sizeH * 0.75;
  var screenX = W / 2 + Math.tan(angle) * (W / 2) / Math.tan(state.fov / 2);
  var x0 = Math.floor(screenX - sizeW / 2);
  var x1 = Math.floor(screenX + sizeW / 2);
  var yBot = Math.floor(horizon + (H / corrected) / 2);
  var yTop = Math.floor(yBot - sizeH);

  var fog = Math.min(1, corrected / 14);
  var tint = 1 - fog * 0.85;

  var e = sp.enemy;
  var bob = Math.sin(e.wobble) * sizeH * 0.02;
  var walkOff = e.frame === 0 ? 0 : sizeH * 0.02;

  var startCol = Math.max(0, Math.floor(x0 / colW));
  var endCol = Math.min(rayCount - 1, Math.ceil(x1 / colW));

  var bodyR = Math.round(170 * tint);
  var bodyG = Math.round(25 * tint);
  var bodyB = Math.round(30 * tint);
  var darkR = Math.round(75 * tint);
  var darkG = Math.round(10 * tint);
  var darkB = Math.round(15 * tint);
  var hornR = Math.round(45 * tint);
  var hornG = Math.round(40 * tint);
  var hornB = Math.round(55 * tint);
  var eyeR  = Math.round(255 * tint);
  var eyeG  = Math.round(230 * tint);
  var whiteR = Math.round(230 * tint);
  var whiteG = Math.round(230 * tint);
  var whiteB = Math.round(230 * tint);

  for (var c = startCol; c <= endCol; c++) {
    if (zbuf[c] < corrected) continue;

    var sx = c * colW;
    var sw = colW + 1;
    var uMid = ((sx + sw / 2) - x0) / sizeW;
    if (uMid < 0 || uMid > 1) continue;

    var bodyStyle = 'rgb(' + bodyR + ',' + bodyG + ',' + bodyB + ')';
    var darkStyle = 'rgb(' + darkR + ',' + darkG + ',' + darkB + ')';
    var hornStyle = 'rgb(' + hornR + ',' + hornG + ',' + hornB + ')';

    // Рога
    if (uMid < 0.22 || uMid > 0.78) {
      ctx.fillStyle = hornStyle;
      ctx.fillRect(sx, yTop + bob, sw, sizeH * 0.09);
    }

    // Голова
    if (uMid > 0.18 && uMid < 0.82) {
      ctx.fillStyle = bodyStyle;
      ctx.fillRect(sx, yTop + sizeH * 0.09 + bob, sw, sizeH * 0.20);
    }

    // Глаза
    var eye1 = (uMid > 0.28 && uMid < 0.40);
    var eye2 = (uMid > 0.60 && uMid < 0.72);
    if ((eye1 || eye2) && sizeH > 25) {
      ctx.fillStyle = 'rgb(' + eyeR + ',' + eyeG + ',0)';
      ctx.fillRect(sx, yTop + sizeH * 0.14 + bob, sw, sizeH * 0.045);
    }

    // Рот с зубами
    if (uMid > 0.35 && uMid < 0.65 && sizeH > 40) {
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop + sizeH * 0.24 + bob, sw, sizeH * 0.045);
      if ((((c % 4) === 0) || ((c % 4) === 2)) && sizeH > 55) {
        ctx.fillStyle = 'rgb(' + whiteR + ',' + whiteG + ',' + whiteB + ')';
        ctx.fillRect(sx, yTop + sizeH * 0.245 + bob, sw, sizeH * 0.018);
      }
    }

    // Торс
    if (uMid > 0.16 && uMid < 0.84) {
      ctx.fillStyle = bodyStyle;
      ctx.fillRect(sx, yTop + sizeH * 0.30 + bob, sw, sizeH * 0.42);
    }

    // Тёмная полоса на груди
    if (uMid > 0.30 && uMid < 0.70) {
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop + sizeH * 0.44 + bob, sw, sizeH * 0.07);
    }

    // Ноги (с анимацией)
    if (uMid > 0.16 && uMid < 0.42) {
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yBot - sizeH * 0.27 + walkOff, sw, sizeH * 0.27);
    }
    if (uMid > 0.58 && uMid < 0.84) {
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yBot - sizeH * 0.27 - walkOff, sw, sizeH * 0.27);
    }
  }
}

function drawGun() {
  var gunW = Math.min(W * 0.26, 220);
  var gunH = gunW * 0.7;
  var kick = state.pistolKick * 12;
  var bobX = Math.sin(state.bob) * 4;
  var gx = W / 2 - gunW / 2 + bobX;
  var gy = H - gunH * 0.12 + kick + Math.sin(state.bob) * 3;

  // Тень ствола
  ctx.fillStyle = '#0a0a10';
  ctx.fillRect(gx + gunW * 0.34, gy + 4, gunW * 0.32, gunH);

  // Основа ствола
  ctx.fillStyle = '#25252f';
  ctx.fillRect(gx + gunW * 0.36, gy - gunH * 0.25, gunW * 0.28, gunH * 0.7);

  // Ствол
  ctx.fillStyle = '#35353f';
  ctx.fillRect(gx + gunW * 0.44, gy - gunH * 0.4, gunW * 0.12, gunH * 0.35);

  // Отверстие
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(gx + gunW * 0.5, gy - gunH * 0.38, gunW * 0.045, 0, Math.PI * 2);
  ctx.fill();

  // Вспышка на выстреле
  if (state.muzzleFlash > 0.05) {
    var mf = state.muzzleFlash;
    var mx = gx + gunW * 0.5;
    var my = gy - gunH * 0.42;
    var grd = ctx.createRadialGradient(mx, my, 0, mx, my, gunW * 0.4 * mf);
    grd.addColorStop(0, 'rgba(255,240,180,' + (mf * 0.95) + ')');
    grd.addColorStop(0.4, 'rgba(255,180,50,' + (mf * 0.7) + ')');
    grd.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(mx - gunW * 0.5, my - gunW * 0.5, gunW, gunW);
  }

  // Блик на стволе
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(gx + gunW * 0.37, gy - gunH * 0.22, gunW * 0.02, gunH * 0.5);
}

// ============ MAIN LOOP ============
var lastTime = 0;
function mainLoop(t) {
  var dt = Math.min(0.05, (t - lastTime) / 1000 || 0.016);
  lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(mainLoop);
}

resize();
})();
</script>
