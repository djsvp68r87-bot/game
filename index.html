<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>ARENA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100vw;height:100vh;margin:0;padding:0;overflow:hidden;background:#000;font-family:"Courier New",monospace;touch-action:none;color:#fff;position:fixed;top:0;left:0}
.screen{position:fixed;inset:0;z-index:50;display:none}
#menuScreen{background:linear-gradient(180deg,#0057b7 0%,#0057b7 50%,#ffd700 50%,#ffd700 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
#menuTitle{position:absolute;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:44px;letter-spacing:12px;font-weight:900;color:#fff;text-shadow:3px 3px 0 #000,0 0 30px rgba(0,0,0,0.95);z-index:2}
#menuSubtitle{position:absolute;top:calc(72px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:6px;color:#fff;text-shadow:2px 2px 0 #000;z-index:2}
#menuSoldier{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-height:44vh;position:relative;z-index:2;margin-top:100px;margin-bottom:10px}
#menuSoldier svg{max-height:100%;height:auto;width:auto;image-rendering:pixelated;filter:drop-shadow(0 12px 32px rgba(0,0,0,0.85))}
#menuPlay{padding:18px 70px;font-size:24px;font-weight:900;letter-spacing:8px;background:#1a1a1a;color:#ffd700;border:4px solid #ffd700;font-family:"Courier New",monospace;cursor:pointer;box-shadow:0 0 30px rgba(255,215,0,0.7),inset 0 0 15px rgba(255,215,0,0.2);z-index:2;position:relative;margin-bottom:20px}
#menuPlay:active{background:#ffd700;color:#1a1a1a}
#levelsScreen{background:linear-gradient(180deg,#1a1a22 0%,#0a0a12 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#levelsTitle{font-size:28px;letter-spacing:8px;color:#ffcc00;margin-bottom:20px;font-weight:900;text-shadow:0 0 16px rgba(255,200,0,0.5)}
#levelsGrid{display:grid;grid-template-columns:repeat(4,70px);gap:12px;margin-bottom:24px;justify-content:center}
.lvlBtn{width:70px;height:70px;border:3px solid #444;background:#222;color:#aaa;font-family:"Courier New",monospace;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.lvlBtn.unlocked{border-color:#ffcc00;background:#1a1a10;color:#ffcc00}
.lvlBtn.unlocked:active{background:#ffcc00;color:#1a1a10}
.lvlBtn.boss{grid-column:span 4;width:auto;height:56px;border-color:#ff3344;color:#ff3344;font-size:20px;background:#1a0a10}
.lvlBtn.boss.unlocked{box-shadow:0 0 24px rgba(255,50,80,0.6)}
.lvlBtn.boss.unlocked:active{background:#ff3344;color:#1a0a10}
.lvlBtn.locked{opacity:0.5}
#levelsBack{padding:12px 40px;background:#1a1a1a;color:#aaa;border:2px solid #444;font-family:"Courier New",monospace;font-size:16px;font-weight:900;letter-spacing:4px;cursor:pointer}
#levelsBack:active{background:#333}
#gameScreen{display:none;z-index:10;position:fixed;inset:0}
#gameScreen.active{display:block}
#cv{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:"Courier New",monospace;font-weight:900}
#hudLeft{position:absolute;top:calc(6px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;gap:8px}
#hudCenter{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%)}
.hud-item{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,0.65);border:2px solid currentColor;font-size:14px;letter-spacing:2px;box-shadow:0 0 12px currentColor}
.hud-item .label{font-size:11px;opacity:0.65;letter-spacing:1px}
.hud-item .val{font-size:16px}
.hud-hp{color:#ff4444}
.hud-am{color:#66ddff}
.hud-sc{color:#88ff88}
#minimap{position:fixed;right:calc(6px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top));background:rgba(0,0,0,0.85);border:2px solid #888;z-index:11;image-rendering:pixelated;display:block}
#weaponBtn{position:fixed;right:calc(6px + env(safe-area-inset-right));top:calc(102px + env(safe-area-inset-top));width:140px;height:52px;z-index:12;cursor:pointer;background:rgba(0,0,0,0.82);border:2px solid #ffcc00;box-shadow:0 0 12px rgba(255,200,0,0.45);display:flex;align-items:center;justify-content:center;padding:4px}
#weaponBtn:active{transform:scale(0.95);background:rgba(60,50,0,0.9)}
#weaponBtn svg{width:100%;height:100%}
#fireHint{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));font-family:"Courier New",monospace;font-weight:900;font-size:13px;letter-spacing:2px;color:rgba(255,80,80,0.45);border:2px dashed rgba(255,80,80,0.4);padding:8px 14px;z-index:4;pointer-events:none;border-radius:4px}
#joy-base{position:fixed;left:calc(20px + env(safe-area-inset-left));bottom:calc(5px + env(safe-area-inset-bottom));width:130px;height:130px;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.25);z-index:10;pointer-events:none}
#joy-stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;background:rgba(255,215,60,0.75);border:2px solid rgba(255,255,255,0.55);box-shadow:0 0 16px rgba(255,200,60,0.7)}
#cross{position:fixed;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;z-index:5;pointer-events:none}
#cross::before,#cross::after{content:'';position:absolute;background:#ffcc00;box-shadow:0 0 6px #000,0 0 4px #ff8800}
#cross::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
#cross::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
#flash{position:fixed;inset:0;background:#ffe0a0;opacity:0;pointer-events:none;z-index:6}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse at center,transparent 30%,rgba(180,0,0,0.85) 100%);opacity:0;transition:opacity 0.4s ease-out}
#reloadBar{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);width:180px;height:14px;border:2px solid #ffcc00;background:rgba(0,0,0,0.7);z-index:12;display:none}
#reloadBar .fill{height:100%;background:#ffcc00;width:0%}
#reloadBar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:1px 1px 0 #000}
#version{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:1px;font-family:"Courier New",monospace;z-index:8;pointer-events:none}
#dead{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(40,0,0,0.92);z-index:20;text-align:center;font-family:"Courier New",monospace;padding:20px}
#dead h1{font-size:44px;color:#ff3344;margin-bottom:18px;letter-spacing:8px;font-weight:900;text-shadow:0 0 30px #f00,0 0 8px #f00}
#dead .stat{font-size:22px;color:#ffcc00;letter-spacing:4px;margin:6px 0}
#dead .btnRow{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.btn{font-family:"Courier New",monospace;font-weight:900;font-size:15px;letter-spacing:3px;padding:14px 30px;cursor:pointer;border:none}
.btn.primary{background:#ffcc00;color:#000}
.btn.primary:active{background:#fff}
.btn.ghost{background:transparent;color:#ccc;border:2px solid #666}
.btn.ghost:active{background:#333}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,40,10,0.92);z-index:20;text-align:center;font-family:"Courier New",monospace;padding:20px}
#win h1{font-size:40px;color:#88ff88;margin-bottom:18px;letter-spacing:8px;font-weight:900;text-shadow:0 0 30px #0f0}
#win .stat{font-size:22px;color:#ffcc00;letter-spacing:4px;margin:6px 0}
#win .btnRow{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;justify-content:center}
#rotate{position:fixed;inset:0;background:#05050a;color:#ffcc00;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100;font-family:"Courier New",monospace;font-size:20px;font-weight:900;letter-spacing:3px;text-align:center;padding:20px}
#rotate .box{width:70px;height:120px;border:3px solid #ffcc00;margin-bottom:24px;animation:rot 2s ease-in-out infinite;box-shadow:0 0 20px #ff8800}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#vhsLine{position:fixed;left:0;right:0;height:3px;background:rgba(255,255,255,0.07);pointer-events:none;z-index:15;display:none}
</style>
</head>

<script>
(function(){
"use strict";

// ===== BACKGROUND MUSIC =====
var BG_MUSIC = null;
function initBgMusic(){
  if (BG_MUSIC) return;
  try {
    BG_MUSIC = new Audio('Rory_in_early_20s_-_yaderi_80164590.mp3');
    BG_MUSIC.loop = true;
    BG_MUSIC.volume = 0.35;
    BG_MUSIC.preload = 'auto';
  } catch(e) { BG_MUSIC = null; }
}
function playBgMusic(){
  initBgMusic();
  if (!BG_MUSIC) return;
  var p = BG_MUSIC.play();
  if (p && p.catch) p.catch(function(){});
}
function pauseBgMusic(){
  if (!BG_MUSIC) return;
  try { BG_MUSIC.pause(); } catch(e){}
}

var MAX_LEVEL = 20;
var progress = 1;
try {
  var stored = localStorage.getItem('arena_progress_v3');
  if (stored) { var n = parseInt(stored, 10); if (!isNaN(n) && n >= 1 && n <= MAX_LEVEL) progress = n; }
} catch(e){ progress = 1; }
if (progress < 1) progress = 1;
if (progress > MAX_LEVEL) progress = MAX_LEVEL;
function saveProgress(){ try{ localStorage.setItem('arena_progress_v3', String(progress)); }catch(e){} }
function unlockNext(level){ if (level >= progress && level < MAX_LEVEL){ progress = level + 1; saveProgress(); } }

var WEAPONS = {
  pistol: { name:'PISTOL', speed:1.7, damage:25, magSize:7, reloadTime:3.0 },
  knife:  { name:'KNIFE',  speed:2.5, damage:0 }
};

var KNIFE_SVG = '<svg viewBox="0 0 120 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' +
  '<path d="M 45 20 L 100 22 L 113 25 L 100 28 L 45 30 Z" fill="#d8e2ec"/>' +
  '<path d="M 45 25 L 100 25 L 113 25 L 100 28 L 45 30 Z" fill="#8a96a4"/>' +
  '<rect x="38" y="18" width="8" height="14" fill="#4a4a4a" rx="1"/>' +
  '<rect x="8" y="19" width="32" height="12" fill="#3a2a1a" rx="2"/>' +
  '<circle cx="36" cy="25" r="3" fill="#8a7a3a"/>' +
  '</svg>';

var PISTOL_SVG = '<svg viewBox="0 0 120 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' +
  '<rect x="18" y="14" width="82" height="14" fill="#3a3a42" rx="2"/>' +
  '<rect x="18" y="16" width="82" height="3" fill="#5a5a62"/>' +
  '<circle cx="97" cy="21" r="5" fill="#000"/>' +
  '<rect x="12" y="17" width="28" height="16" fill="#2a2a32" rx="2"/>' +
  '<path d="M 18 30 L 36 30 L 40 48 L 18 48 Z" fill="#1a1a20"/>' +
  '</svg>';

function weaponSVG(n){ return n === 'knife' ? KNIFE_SVG : PISTOL_SVG; }

var SPAWN = {
  1:{n:5,f:2,s:1}, 2:{n:5,f:5,s:0}, 3:{n:5,f:0,s:5}, 4:{n:3,f:3,s:3},
  5:{n:0,f:5,s:5}, 6:{n:5,f:3,s:3}, 7:{n:5,f:4,s:3}, 8:{n:5,f:4,s:4}, 9:{n:5,f:5,s:5},
  11:{n:30,f:10,s:0}, 12:{n:40,f:0,s:0}, 13:{n:15,f:15,s:10}, 14:{n:50,f:0,s:0},
  15:{n:0,f:30,s:0}, 16:{n:20,f:0,s:20}, 17:{n:50,f:10,s:0}, 18:{n:0,f:40,s:10},
  19:{n:30,f:20,s:20}
};

// ===== AUDIO =====
var AC = null;
function initAudio(){
  initBgMusic();
  playBgMusic();
  if (AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }catch(e){ AC = null; }
}
function tone(f,t,d,v,fe){
  if (!AC) return;
  try{
    var t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = t; o.frequency.setValueAtTime(f, t0);
    if (fe) o.frequency.exponentialRampToValueAtTime(Math.max(1,fe), t0+d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+d+0.05);
  }catch(e){}
}
function noise(d,v,ff){
  if (!AC) return;
  try{
    var t0 = AC.currentTime, l = Math.floor(AC.sampleRate * d);
    var b = AC.createBuffer(1, l, AC.sampleRate), a = b.getChannelData(0);
    for (var i = 0; i < l; i++) a[i] = (Math.random()*2-1) * (1 - i/l);
    var s = AC.createBufferSource(); s.buffer = b;
    var fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = ff;
    var g = AC.createGain();
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
    s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t0);
  }catch(e){}
}
function sndGun(){ tone(240,'square',0.09,0.18,40); noise(0.12,0.20,1400); }
function sndHit(){ tone(500,'square',0.06,0.14,220); noise(0.06,0.10,2000); }
function sndDeath(){ tone(180,'sawtooth',0.5,0.22,30); noise(0.4,0.12,600); }
function sndHurt(){ tone(90,'square',0.35,0.22,40); noise(0.2,0.15,500); }
function sndGrowl(){ tone(50+Math.random()*30,'sawtooth',0.7,0.06,25); }
function sndEnemyShot(){ tone(400,'square',0.08,0.12,180); }
function sndWin(){ tone(520,'square',0.15,0.2); setTimeout(function(){tone(660,'square',0.15,0.2);},150); setTimeout(function(){tone(880,'square',0.3,0.25);},300); }
function sndReloadStart(){ tone(300,'square',0.08,0.12); }
function sndReloadEnd(){ tone(700,'square',0.08,0.12); tone(900,'square',0.08,0.10); }

function sndKnife(){ tone(400,'triangle',0.06,0.1,200); noise(0.05,0.08,3000); }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function generateMap(level){
  if (level === 10 || level === 20) return generateBossArena();
  var size = 20 + Math.min(level, 12) * 2;
  var W = size, H = size, grid = [];
  for (var y = 0; y < H; y++){ var r = []; for (var x = 0; x < W; x++){ if (x===0||y===0||x===W-1||y===H-1) r.push(1); else r.push(0); } grid.push(r); }
  var rng = mulberry32(level*1337+42), rooms = [];
  var attempts = 30 + level*3;
  for (var i = 0; i < attempts; i++){
    var rw = 2 + Math.floor(rng()*4), rh = 2 + Math.floor(rng()*4);
    var rx = 1 + Math.floor(rng()*(W-rw-2)), ry = 1 + Math.floor(rng()*(H-rh-2));
    var ov = false;
    for (var r = 0; r < rooms.length; r++){
      var rm = rooms[r];
      if (rx < rm.x+rm.w+1 && rx+rw+1 > rm.x && ry < rm.y+rm.h+1 && ry+rh+1 > rm.y){ ov = true; break; }
    }
    if (ov) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh});
    for (var yy = ry-1; yy <= ry+rh; yy++) for (var xx = rx-1; xx <= rx+rw; xx++){
      if (xx<0||yy<0||xx>=W||yy>=H) continue;
      if (yy===ry-1||yy===ry+rh||xx===rx-1||xx===rx+rw) grid[yy][xx] = 1;
    }
    for (var y2 = ry; y2 < ry+rh; y2++) for (var x2 = rx; x2 < rx+rw; x2++) grid[y2][x2] = 0;
  }
  for (var i2 = 1; i2 < rooms.length; i2++){
    var a = rooms[i2-1], b = rooms[i2];
    var ax = Math.floor(a.x+a.w/2), ay = Math.floor(a.y+a.h/2);
    var bx = Math.floor(b.x+b.w/2), by = Math.floor(b.y+b.h/2);
    var sx = ax < bx ? 1 : -1;
    for (var x3 = ax; x3 !== bx; x3 += sx){ if (grid[ay][x3]===1) grid[ay][x3] = 0; if (grid[ay][x3+1]===1) grid[ay][x3+1] = 0; }
    var sy = ay < by ? 1 : -1;
    for (var y3 = ay; y3 !== by; y3 += sy){ if (grid[y3][bx]===1) grid[y3][bx] = 0; if (grid[y3+1][bx]===1) grid[y3+1][bx] = 0; }
  }
  for (var k = 0; k < rooms.length; k++){
    var rm2 = rooms[k];
    if (rm2.w >= 3 && rm2.h >= 3 && rng() < 0.5){
      var cx = rm2.x+1+Math.floor(rng()*(rm2.w-2));
      var cy = rm2.y+1+Math.floor(rng()*(rm2.h-2));
      grid[cy][cx] = 1;
    }
  }
  return {grid:grid, W:W, H:H};
}
function generateBossArena(){
  var W = 16, H = 16, grid = [];
  for (var y = 0; y < H; y++){ var row = []; for (var x = 0; x < W; x++){ if (x===0||y===0||x===W-1||y===H-1) row.push(1); else row.push(0); } grid.push(row); }
  grid[3][3] = 1; grid[3][W-4] = 1; grid[H-4][3] = 1; grid[H-4][W-4] = 1;
  return {grid:grid, W:W, H:H};
}

function isWall(x, y){
  var mx = Math.floor(x), my = Math.floor(y);
  if (mx<0||mx>=state.MAP_W||my<0||my>=state.MAP_H) return true;
  return state.map[my][mx] === 1;
}

var BOSS_DEF = { hp:500, speed:0.9, dmg:25, skin:'#0d3a10', dark:'#051505', blood:'#7a0808', scale:3.0 };

function makeZombie(x, y, kind, skin){
  var d = ZDEF[kind][skin];
  return {
    x:x, y:y, hp:d.hp, maxHp:d.hp, alive:true,
    kind:kind, skin:skin, def:d,
    lastAttack:0, wobble:Math.random()*6.28,
    frame:0, frameTimer:0, growlTimer:2+Math.random()*6,
    shootCooldown:1+Math.random()*1.5,
    hasGun:!!d.hasGun, scale:d.scale||1
  };
}
function makeBoss(x, y){
  return {
    x:x, y:y, hp:BOSS_DEF.hp, maxHp:BOSS_DEF.hp, alive:true,
    kind:'boss', skin:'dark', def:BOSS_DEF,
    lastAttack:0, wobble:0, frame:0, frameTimer:0,
    growlTimer:1, scale:BOSS_DEF.scale, isBoss:true,
    attackPhase:0, attackTimer:0, attackCooldown:0, stonesThrown:0
  };
}
function findFreeCellFar(minDist){
  minDist = minDist || 5;
  for (var t = 0; t < 800; t++){
    var x = 1.5 + Math.random() * (state.MAP_W - 3);
    var y = 1.5 + Math.random() * (state.MAP_H - 3);
    if (!isWall(x, y) && Math.hypot(x-state.px, y-state.py) > minDist &&
        !isWall(x+0.4,y) && !isWall(x-0.4,y) && !isWall(x,y+0.4) && !isWall(x,y-0.4)) return {x:x, y:y};
  }
  return {x:4, y:4};
}
function findSafeSpawn(){
  for (var t = 0; t < 1500; t++){
    var x = 2.5 + Math.random() * (state.MAP_W - 5);
    var y = 2.5 + Math.random() * (state.MAP_H - 5);
    var ok = true;
    for (var dx = -0.7; dx <= 0.7; dx += 0.35){
      for (var dy = -0.7; dy <= 0.7; dy += 0.35){
        if (isWall(x+dx, y+dy)){ ok = false; break; }
      }
      if (!ok) break;
    }
    if (ok) return {x:x, y:y};
  }
  return {x:2.5, y:2.5};
}
function pickSkin(rng){
  var r = rng();
  if (r < 0.25) return 'dark';
  if (r < 0.65) return 'green';
  return 'light';
}
function spawnLevel(level){
  state.enemies = [];
  if (level === 10 || level === 20){
    var bp = findFreeCellFar(6);
    state.enemies.push(makeBoss(bp.x, bp.y));
    state.totalEnemies = 1;
    return;
  }
  var tbl = SPAWN[level] || {n:5,f:5,s:5};
  var rng = mulberry32(level*999+1), kinds = [];
  for (var i = 0; i < tbl.n; i++) kinds.push('normal');
  for (var i2 = 0; i2 < tbl.f; i2++) kinds.push('fast');
  for (var i3 = 0; i3 < tbl.s; i3++) kinds.push('shooter');
  for (var k = kinds.length-1; k > 0; k--){
    var j = Math.floor(rng()*(k+1));
    var t = kinds[k]; kinds[k] = kinds[j]; kinds[j] = t;
  }
  for (var ki = 0; ki < kinds.length; ki++){
    var p = findFreeCellFar(4);
    state.enemies.push(makeZombie(p.x, p.y, kinds[ki], pickSkin(rng)));
  }
  state.totalEnemies = state.enemies.length;
}

function startLevel(level){
  state.level = level;
  var m = generateMap(level);
  state.map = m.grid; state.MAP_W = m.W; state.MAP_H = m.H;
  var sp = findSafeSpawn();
  state.px = sp.x; state.py = sp.y;
  state.dir = 0; state.pitch = 0;
  state.hp = 100; state.maxHp = 100;
  state.score = 0; state.dead = false; state.won = false;
  state.blood = []; state.particles = []; state.enemyBullets = [];
  state.hurtFlash = 0; state.pistolKick = 0; state.muzzleFlash = 0;
  state.currentWeapon = 'pistol';
  state.magAmmo = 7; state.reloading = false; state.reloadTimer = 0;
  state.headshotFlash = 0;
  state.bob = 0;
  state.timeStart = performance.now();
  spawnLevel(level);
  updateAmmoHUD();
  document.getElementById('hp').textContent = '100';
  document.getElementById('sc').textContent = '0 / ' + state.totalEnemies;
  document.getElementById('dead').style.display = 'none';
  document.getElementById('win').style.display = 'none';
  document.getElementById('reloadBar').style.display = 'none';
  document.getElementById('vhsLine').style.display = 'block';
  updateWeaponBtn();
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('levelsScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.add('active');
  resize();
  state.running = true;
  playBgMusic();
  startLoop();
}

var keys = {w:0,a:0,s:0,d:0};
var joy = {
  active:false, id:null, cx:0, cy:0, dx:0, dy:0,
  baseEl: document.getElementById('joy-base'),
  stickEl: document.getElementById('joy-stick')
};
function updateJoyBase(){ var r = joy.baseEl.getBoundingClientRect(); joy.cx = r.left+r.width/2; joy.cy = r.top+r.height/2; }
function setStick(x, y){ joy.stickEl.style.left = (50+x*50)+'%'; joy.stickEl.style.top = (50+y*50)+'%'; }

var look = {active:false, id:null, lastX:0, lastY:0};
var fireTap = {active:false, id:null, startX:0, startY:0, startTime:0, moved:false, isRight:false};

cv.addEventListener('touchstart', function(e){
  if (state.dead || !state.running) return;
  updateJoyBase();
  var vw = window.innerWidth, vh = window.innerHeight;
  for (var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    var isRightZone = t.clientX > vw * 0.50;
    if (!joy.active && t.clientX < vw * 0.5 && t.clientY > vh * 0.5){
      joy.active = true; joy.id = t.identifier; joy.dx = 0; joy.dy = 0; setStick(0,0); continue;
    }
    if (isRightZone && !fireTap.active && !look.active){
      fireTap.active = true; fireTap.id = t.identifier;
      fireTap.startX = t.clientX; fireTap.startY = t.clientY;
      fireTap.startTime = performance.now();
      fireTap.moved = false; fireTap.isRight = true;
      look.active = true; look.id = t.identifier; look.lastX = t.clientX; look.lastY = t.clientY;
      continue;
    }
    if (!look.active){ look.active = true; look.id = t.identifier; look.lastX = t.clientX; look.lastY = t.clientY; }
  }
  e.preventDefault();
}, {passive:false});

cv.addEventListener('touchmove', function(e){
  for (var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    if (joy.active && t.identifier === joy.id){
      var dx = t.clientX - joy.cx, dy = t.clientY - joy.cy;
      var len = Math.hypot(dx,dy), maxR = 60;
      var nx = len > maxR ? dx/len : dx/maxR;
      var ny = len > maxR ? dy/len : dy/maxR;
      joy.dx = nx; joy.dy = ny; setStick(nx, ny);
    }
    if (look.active && t.identifier === look.id){
      var lx = t.clientX - look.lastX, ly = t.clientY - look.lastY;
      look.lastX = t.clientX; look.lastY = t.clientY;
      if (fireTap.active && t.identifier === fireTap.id){
        var totalDx = t.clientX - fireTap.startX;
        var totalDy = t.clientY - fireTap.startY;
        if (Math.hypot(totalDx, totalDy) > 15) fireTap.moved = true;
      }
      state.dir += lx * 0.007;
      state.pitch -= ly * 2.5;
      var maxPitch = H * 0.35;
      if (state.pitch > maxPitch) state.pitch = maxPitch;
      if (state.pitch < -maxPitch) state.pitch = -maxPitch;
    }
  }
  e.preventDefault();
}, {passive:false});

function endTouch(e){
  for (var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    if (joy.active && t.identifier === joy.id){ joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0; setStick(0,0); }
    if (look.active && t.identifier === look.id){ look.active = false; look.id = null; }
    if (fireTap.active && t.identifier === fireTap.id){
      var dt = performance.now() - fireTap.startTime;
      if (!fireTap.moved && dt < 350 && fireTap.isRight) fire();
      fireTap.active = false; fireTap.id = null;
    }
  }
  e.preventDefault();
}
cv.addEventListener('touchend', endTouch, {passive:false});
cv.addEventListener('touchcancel', endTouch, {passive:false});

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (k in keys) keys[k] = 1;
  if (k === ' ') fire();
  if (k === 'q' || k === 'tab') switchWeapon();
  if (k === 'r') startReload();
  if (k === 'arrowup'){ state.pitch -= 15; if (state.pitch < -H*0.35) state.pitch = -H*0.35; }
  if (k === 'arrowdown'){ state.pitch += 15; if (state.pitch > H*0.35) state.pitch = H*0.35; }
});
window.addEventListener('keyup', function(e){ var k = e.key.toLowerCase(); if (k in keys) keys[k] = 0; });

function renderLevelGrid(){
  var grid = document.getElementById('levelsGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i = 1; i <= MAX_LEVEL; i++){
    var btn = document.createElement('button');
    btn.className = 'lvlBtn';
    var isBoss = (i === 10 || i === 20), unlocked = i <= progress;
    if (isBoss) btn.className += ' boss';
    if (unlocked) btn.className += ' unlocked'; else btn.className += ' locked';
    btn.textContent = isBoss ? 'BOSS' : String(i);
    if (unlocked){ (function(lvl){ btn.addEventListener('click', function(){ initAudio(); startLevel(lvl); }); })(i); }
    grid.appendChild(btn);
  }
}

function startReload(){
  if (state.reloading || state.currentWeapon !== 'pistol') return;
  if (state.magAmmo >= WEAPONS.pistol.magSize) return;
  state.reloading = true; state.reloadTimer = 0;
  sndReloadStart();
  document.getElementById('reloadBar').style.display = 'block';
  document.getElementById('reloadFill').style.width = '0%';
}

function fire(){
  if (!state.running || state.dead || state.won) return;
  if (state.currentWeapon === 'knife'){
    state.pistolKick = 0.8;
    sndKnife();
    var kdx = Math.cos(state.dir), kdy = Math.sin(state.dir);
    for (var i = 0; i < state.enemies.length; i++){
      var en = state.enemies[i];
      if (!en.alive) continue;
      var ex = en.x - state.px, ey = en.y - state.py;
      var proj = ex*kdx + ey*kdy;
      if (proj > 0 && proj < 1.2){
        var perp = Math.abs(ex*kdy - ey*kdx);
        if (perp < 0.5 && !wallBetween(state.px, state.py, en.x, en.y)) spawnBlood(en.x, en.y, 4);
      }
    }
    return;
  }
  if (state.reloading) return;
  if (state.magAmmo <= 0){ startReload(); return; }

  state.magAmmo--;
  updateAmmoHUD();
  sndGun();
  state.pistolKick = 1;
  state.muzzleFlash = 1;
  var flash = document.getElementById('flash');
  flash.style.transition = 'none';
  flash.style.opacity = '0.22';
  requestAnimationFrame(function(){ flash.style.transition = 'opacity 0.12s'; flash.style.opacity = '0'; });

  var dx = Math.cos(state.dir), dy = Math.sin(state.dir);
  var hit = null, hitDist = Infinity, hitVerticalPct = 0;
  var horizon = H/2 + state.pitch;

  for (var i = 0; i < state.enemies.length; i++){
    var en = state.enemies[i];
    if (!en.alive) continue;
    var ex = en.x - state.px, ey = en.y - state.py;
    var proj = ex*dx + ey*dy;
    if (proj < 0) continue;
    var perp = Math.abs(ex*dy - ey*dx);
    var hitR = en.isBoss ? 1.4 : 0.4;
    if (perp < hitR && proj < hitDist && !wallBetween(state.px, state.py, en.x, en.y)){
      var scale = en.scale || 1;
      var sizeH = Math.min(H*2, H/proj) * scale;
      var yBot = horizon + (H/proj)/2;
      var yTop = yBot - sizeH;
      var pct = (H/2 - yTop) / sizeH;
      if (pct < 0 || pct > 1) continue;
      hit = en; hitDist = proj; hitVerticalPct = pct;
    }
  }
  if (hit){
    var headshot = hitVerticalPct < 0.30;
    var dmg = headshot ? 75 : 25;
    hit.hp -= dmg;
    if (headshot){ sndHeadshot(); state.headshotFlash = 0.5; } else { sndHit(); }
    spawnBlood(hit.x, hit.y, headshot ? 14 : 7);
    if (hit.hp <= 0){
      hit.alive = false;
      state.score++;
      updateKillsHUD();
      sndDeath();
      spawnBlood(hit.x, hit.y, 16);
    }
    if (state.magAmmo <= 0 && !state.reloading) startReload();
  }
}

function wallBetween(x1, y1, x2, y2){
  var steps = Math.ceil(Math.hypot(x2-x1, y2-y1) * 8);
  for (var i = 1; i < steps; i++){
    var t = i / steps;
    if (isWall(x1 + (x2-x1)*t, y1 + (y2-y1)*t)) return true;
  }
  return false;
}
function spawnBlood(x, y, n){
  for (var i = 0; i < n; i++){
    var ang = Math.random()*Math.PI*2, spd = 0.5 + Math.random()*1.5;
    state.particles.push({
      x:x, y:y, z:0.5+Math.random()*0.3,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, vz:1+Math.random()*2,
      life:0.8+Math.random()*0.6, maxLife:1.4,
      color: Math.random() > 0.5 ? '#aa0000' : '#cc1111',
      size:0.06+Math.random()*0.08
    });
  }
  if (state.blood.length > 40) state.blood.shift();
  state.blood.push({x:x, y:y, r:0.25+Math.random()*0.2, alpha:0.65});
}
function playerHurt(dmg){
  state.hp -= dmg;
  state.hurtFlash = 1;
  sndHurt();
  document.getElementById('hp').textContent = Math.max(0, Math.round(state.hp));
  if (state.hp <= 0){
    state.hp = 0; state.dead = true; state.running = false;
    pauseBgMusic();
    document.getElementById('dsc').textContent = state.score + ' / ' + state.totalEnemies;
    document.getElementById('dead').style.display = 'flex';
    document.getElementById('vhsLine').style.display = 'none';
  }
}

function unstickPlayer(){
  if (!isWall(state.px, state.py)) return;
  for (var r = 0.2; r <= 2.0; r += 0.2){
    for (var a = 0; a < 6.28; a += 0.4){
      var tx = state.px + Math.cos(a) * r;
      var ty = state.py + Math.sin(a) * r;
      if (!isWall(tx, ty)){ state.px = tx; state.py = ty; return; }
    }
  }
}

var vhsEl = document.getElementById('vhsLine');
var vhsY = 0;
function updateVHS(dt){
  if (!vhsEl || vhsEl.style.display === 'none') return;
  vhsY += dt * (200 + Math.random() * 400);
  if (vhsY > window.innerHeight){
    vhsY = -10;
    vhsEl.style.opacity = 0.02 + Math.random() * 0.08;
  }
  vhsEl.style.top = vhsY + 'px';
}

function update(dt){
  if (!state.running) return;
  if (state.dead || state.won) return;

  updateVHS(dt);

  state.pistolKick *= Math.max(0, 1 - dt*8);
  state.muzzleFlash *= Math.max(0, 1 - dt*12);
  state.hurtFlash *= Math.max(0, 1 - dt*2);
  state.headshotFlash *= Math.max(0, 1 - dt*2);
  document.getElementById('hurt').style.opacity = (state.hurtFlash*0.85).toFixed(3);
  state.pitch *= Math.max(0, 1 - dt * 0.6);

  if (state.reloading){
    state.reloadTimer += dt;
    var pct = Math.min(1, state.reloadTimer / WEAPONS.pistol.reloadTime);
    document.getElementById('reloadFill').style.width = (pct*100)+'%';
    if (state.reloadTimer >= WEAPONS.pistol.reloadTime){
      state.reloading = false;
      state.magAmmo = WEAPONS.pistol.magSize;
      updateAmmoHUD();
      sndReloadEnd();
      document.getElementById('reloadBar').style.display = 'none';
    }
  }

  var wdef = WEAPONS[state.currentWeapon];
  var speed = wdef.speed;

  var mx = 0, my = 0;
  if (joy.active){ mx = joy.dx; my = joy.dy; }
  if (keys.w) my -= 1;
  if (keys.s) my += 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;
  var len = Math.hypot(mx, my);
  if (len > 1){ mx /= len; my /= len; }
  if (len > 0.05){
    var cos = Math.cos(state.dir), sin = Math.sin(state.dir);
    var fx = -my*cos + mx*-sin;
    var fy = -my*sin + mx*cos;
    var nx = state.px + fx*speed*dt;
    var ny = state.py + fy*speed*dt;
    if (!isWall(nx, state.py)) state.px = nx;
    if (!isWall(state.px, ny)) state.py = ny;
    state.bob += dt * 7;

    for (var pi = 0; pi < state.enemies.length; pi++){
      var pz = state.enemies[pi];
      if (!pz.alive) continue;
      var pdx = state.px - pz.x, pdy = state.py - pz.y;
      var pd = Math.hypot(pdx, pdy);
      if (pd < 0.6 && pd > 0.001){
        var pushSpeed = 4 * dt;
        var pnx = pz.x - (pdx/pd) * pushSpeed;
        var pny = pz.y - (pdy/pd) * pushSpeed;
        if (!isWall(pnx, pz.y)) pz.x = pnx;
        if (!isWall(pz.x, pny)) pz.y = pny;
      }
    }
  } else state.bob *= 0.9;

  unstickPlayer();

  for (var i = 0; i < state.enemies.length; i++){
    var en = state.enemies[i];
    if (!en.alive) continue;
    en.wobble += dt*3;
    en.frameTimer += dt;
    if (en.frameTimer > 0.22){ en.frameTimer = 0; en.frame = (en.frame+1)%2; }
    en.growlTimer -= dt;
    if (en.growlTimer <= 0){
      en.growlTimer = 4 + Math.random()*8;
      var d2 = Math.hypot(en.x-state.px, en.y-state.py);
      if (d2 < 7) sndGrowl();
    }
    var dx = state.px - en.x, dy = state.py - en.y;
    var dist = Math.hypot(dx, dy);
    if (dist < 0.001) continue;
    if (en.isBoss){ updateBoss(en, dist, dx, dy, dt); continue; }

    var detect = en.hasGun ? 12 : 9;
    var canSee = dist < detect && !wallBetween(en.x, en.y, state.px, state.py);
    if (canSee){
      var minDist = en.hasGun ? 4.0 : 1.0;
      if (dist > minDist){
        var moveDist = en.def.speed;
        var nx2 = en.x + (dx/dist)*moveDist*dt;
        var ny2 = en.y + (dy/dist)*moveDist*dt;
        if (!isWall(nx2, en.y)) en.x = nx2;
        if (!isWall(en.x, ny2)) en.y = ny2;
      }
      if (!en.hasGun && dist < 1.15){
        en.lastAttack += dt;
        if (en.lastAttack > 1.0){ en.lastAttack = 0; playerHurt(en.def.dmg); }
      } else en.lastAttack = 0;
      if (en.hasGun){
        en.shootCooldown -= dt;
        if (en.shootCooldown <= 0 && dist < 12){ en.shootCooldown = 2.0; fireEnemyBullet(en, dx/dist, dy/dist, en.def.dmg, 2.2, '#ffcc00'); }
      }
    }

    for (var oi = i+1; oi < state.enemies.length; oi++){
      var other = state.enemies[oi];
      if (!other.alive) continue;
      var odx = en.x - other.x, ody = en.y - other.y;
      var od = Math.hypot(odx, ody);
      if (od < 0.55 && od > 0.001){
        var force = (0.55 - od) * 4 * dt;
        var ux = odx/od, uy = ody/od;
        var enx = en.x + ux*force, eny = en.y + uy*force;
        var onx = other.x - ux*force, ony = other.y - uy*force;
        if (!isWall(enx, en.y)) en.x = enx;
        if (!isWall(en.x, eny)) en.y = eny;
        if (!isWall(onx, other.y)) other.x = onx;
        if (!isWall(other.x, ony)) other.y = ony;
      }
    }
  }

  for (var bi = state.enemyBullets.length-1; bi >= 0; bi--){
    var b = state.enemyBullets[bi];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || isWall(b.x, b.y)){ state.enemyBullets.splice(bi,1); continue; }
    if (Math.hypot(b.x-state.px, b.y-state.py) < 0.35){ playerHurt(b.dmg); state.enemyBullets.splice(bi,1); }
  }

  for (var p = state.particles.length-1; p >= 0; p--){
    var pt = state.particles[p];
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    pt.vz -= 9*dt; pt.z += pt.vz*dt; pt.life -= dt;
    if (pt.z < 0){ pt.z = 0; pt.vz *= -0.2; pt.vx *= 0.5; pt.vy *= 0.5; }
    if (pt.life <= 0) state.particles.splice(p, 1);
  }
  for (var b2 = 0; b2 < state.blood.length; b2++) state.blood[b2].alpha *= (1 - dt*0.05);

  var aliveCount = 0;
  for (var k = 0; k < state.enemies.length; k++) if (state.enemies[k].alive) aliveCount++;
  if (aliveCount === 0){
    state.won = true; state.running = false;
    sndWin();
    var elapsed = Math.round((performance.now() - state.timeStart)/1000);
    document.getElementById('wsc').textContent = state.score + ' / ' + state.totalEnemies;
    document.getElementById('wtime').textContent = elapsed;
    document.getElementById('win').style.display = 'flex';
    document.getElementById('winNext').style.display = state.level < MAX_LEVEL ? 'block' : 'none';
    document.getElementById('vhsLine').style.display = 'none';
    unlockNext(state.level);
  }
}

function updateBoss(en, dist, dx, dy, dt){
  var centerX = state.MAP_W/2, centerY = state.MAP_H/2;
  var dxC = centerX - en.x, dyC = centerY - en.y;
  var distC = Math.hypot(dxC, dyC);
  if (distC > 3){
    var sx = (dxC/distC) * en.def.speed * dt;
    var sy = (dyC/distC) * en.def.speed * dt;
    if (!isWall(en.x+sx, en.y)) en.x += sx;
    if (!isWall(en.x, en.y+sy)) en.y += sy;
  }
  en.attackCooldown -= dt;
  if (en.attackPhase === 3){
    en.attackTimer += dt;
    if (en.attackTimer >= 3){ en.attackPhase = 0; en.attackTimer = 0; en.stonesThrown = 0; en.attackCooldown = 2; }
    return;
  }
  if (en.attackCooldown <= 0){
    if (en.attackPhase === 0 || en.attackPhase === 1){
      if (dist > 1){ fireEnemyBullet(en, dx/dist, dy/dist, 15, 3.0, '#888888'); tone(120,'square',0.15,0.15,60); }
      en.stonesThrown++;
      en.attackPhase = 1;
      if (en.stonesThrown >= 3){ en.attackPhase = 2; en.attackCooldown = 1.5; } else en.attackCooldown = 2;
    } else if (en.attackPhase === 2){
      var baseAng = Math.atan2(dy, dx);
      for (var a = -0.5; a <= 0.5; a += 0.15){
        var ang = baseAng + a;
        state.enemyBullets.push({ x:en.x, y:en.y, vx:Math.cos(ang)*1.6, vy:Math.sin(ang)*1.6, dmg:25, life:6, color:'#aa4444' });
      }
      tone(200,'sawtooth',0.4,0.2,60);
      en.attackPhase = 3; en.attackTimer = 0;
    }
  }
}
function fireEnemyBullet(en, dx, dy, dmg, spd, color){
  sndEnemyShot();
  state.enemyBullets.push({ x:en.x, y:en.y, vx:dx*spd, vy:dy*spd, dmg:dmg, life:5, color:color||'#ffcc00' });
}

var zbufArr = null, zbufLen = 0;

function wallTex(u, v, side, level){
  if (level === 10 || level === 20){
    var lineH = (v < 0.08 || v > 0.92);
    var lineV = (u < 0.06 || u > 0.94);
    if (lineH || lineV) return side === 0 ? [170,170,180] : [150,150,160];
    var lv = ((u*8) - Math.floor(u*8)) < 0.15;
    if (lv) return side === 0 ? [220,220,230] : [200,200,210];
    return side === 0 ? [250,250,255] : [230,230,240];
  }
  var brickH = 0.25, brickW = 0.5;
  var row = Math.floor(v/brickH);
  var offset = (row%2) * (brickW/2);
  var bx = ((u+offset)%1+1)%1;
  var mortarH = (v/brickH - Math.floor(v/brickH)) < 0.06;
  var mortarV = ((bx/brickW) - Math.floor(bx/brickW)) < 0.05;
  if (mortarH || mortarV) return [90,80,70];
  var seed = (row*7 + Math.floor(bx/brickW)*13) % 5;
  var shade = 0.9 + seed*0.05;
  return [
    Math.min(255, Math.floor((side===0?200:180)*shade)),
    Math.min(255, Math.floor((side===0?130:115)*shade)),
    Math.min(255, Math.floor((side===0?90:80)*shade))
  ];
}

function render(){
  if (!state.map) return;
  var FOV = state.fov, halfFOV = FOV/2;
  var rayCount = Math.min(W, 420);
  var colW = W/rayCount;
  var bobY = Math.sin(state.bob) * 3;
  var horizon = H/2 + bobY + state.pitch;

  var isBoss = (state.level === 10 || state.level === 20);
  var ceilGrad = ctx.createLinearGradient(0, 0, 0, Math.max(1,horizon));
  ceilGrad.addColorStop(0, isBoss ? '#5a5a68' : '#3a3a4a');
  ceilGrad.addColorStop(1, isBoss ? '#7a7a88' : '#5a5a6a');
  ctx.fillStyle = ceilGrad; ctx.fillRect(0, 0, W, Math.max(0, horizon));

  var floorGrad = ctx.createLinearGradient(0, horizon, 0, H);
  floorGrad.addColorStop(0, isBoss ? '#6a6a72' : '#4a4a52');
  floorGrad.addColorStop(1, isBoss ? '#8a8a92' : '#6a6a72');
  ctx.fillStyle = floorGrad; ctx.fillRect(0, Math.max(0, horizon), W, H - Math.max(0, horizon));

  if (!zbufArr || zbufLen !== rayCount){ zbufArr = new Float32Array(rayCount); zbufLen = rayCount; }
  var zbuf = zbufArr;

  for (var i = 0; i < rayCount; i++){
    var angle = state.dir - halfFOV + (i/rayCount)*FOV;
    var rayDx = Math.cos(angle), rayDy = Math.sin(angle);
    var mapX = Math.floor(state.px), mapY = Math.floor(state.py);
    var deltaX = Math.abs(1/rayDx), deltaY = Math.abs(1/rayDy);
    var stepX, stepY, sideDistX, sideDistY;
    if (rayDx < 0){ stepX = -1; sideDistX = (state.px - mapX)*deltaX; } else { stepX = 1; sideDistX = (mapX+1-state.px)*deltaX; }
    if (rayDy < 0){ stepY = -1; sideDistY = (state.py - mapY)*deltaY; } else { stepY = 1; sideDistY = (mapY+1-state.py)*deltaY; }
    var side = 0, hitWall = false;
    for (var s = 0; s < 90 && !hitWall; s++){
      if (sideDistX < sideDistY){ sideDistX += deltaX; mapX += stepX; side = 0; } else { sideDistY += deltaY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapX >= state.MAP_W || mapY < 0 || mapY >= state.MAP_H){ hitWall = true; break; }
      if (state.map[mapY][mapX] === 1) hitWall = true;
    }
    var d = side === 0 ? sideDistX - deltaX : sideDistY - deltaY;
    if (d < 0.001) d = 0.001;
    zbuf[i] = d;
    var corrected = d * Math.cos(angle - state.dir);
    var lineH = Math.min(H*2, H/corrected);
    var y0 = horizon - lineH/2, y1 = horizon + lineH/2;
    var wallX = side === 0 ? state.py + d*rayDy : state.px + d*rayDx;
    wallX -= Math.floor(wallX);
    var base = wallTex(wallX, 0.5, side, state.level);
    var fogMul = 1;
    var px = i*colW, pw = colW+1;
    var topH = (y1-y0)*0.12, midH = (y1-y0)*0.72;
    ctx.fillStyle = 'rgb(' + Math.min(255,Math.floor(base[0]*1.10*fogMul)) + ',' + Math.min(255,Math.floor(base[1]*1.10*fogMul)) + ',' + Math.min(255,Math.floor(base[2]*1.10*fogMul)) + ')';
    ctx.fillRect(px, y0, pw, topH);
    ctx.fillStyle = 'rgb(' + Math.floor(base[0]*fogMul) + ',' + Math.floor(base[1]*fogMul) + ',' + Math.floor(base[2]*fogMul) + ')';
    ctx.fillRect(px, y0+topH, pw, midH);
    ctx.fillStyle = 'rgb(' + Math.floor(base[0]*0.65*fogMul) + ',' + Math.floor(base[1]*0.65*fogMul) + ',' + Math.floor(base[2]*0.65*fogMul) + ')';
    ctx.fillRect(px, y0+topH+midH, pw, (y1-y0)-topH-midH);
  }

  for (var bI = 0; bI < state.blood.length; bI++){
    var bl = state.blood[bI];
    var bdx = bl.x-state.px, bdy = bl.y-state.py;
    var bAng = Math.atan2(bdy, bdx) - state.dir;
    while (bAng > Math.PI) bAng -= Math.PI*2;
    while (bAng < -Math.PI) bAng += Math.PI*2;
    if (Math.abs(bAng) > state.fov) continue;
    var bCorr = Math.hypot(bdx, bdy) * Math.cos(bAng);
    if (bCorr < 0.3) continue;
    var sizeH = Math.min(H*2, H/bCorr);
    var sX = W/2 + Math.tan(bAng)*(W/2)/Math.tan(state.fov/2);
    var fY = horizon + (H/bCorr)/2;
    var sz = sizeH * bl.r;
    ctx.globalAlpha = bl.alpha;
    ctx.fillStyle = '#5a0000';
    ctx.beginPath(); ctx.ellipse(sX, fY, sz*0.5, sz*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a0000';
    ctx.beginPath(); ctx.ellipse(sX, fY, sz*0.3, sz*0.11, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  var sprites = [];
  for (var k = 0; k < state.enemies.length; k++){
    var e = state.enemies[k];
    if (!e.alive) continue;
    var ddx = e.x-state.px, ddy = e.y-state.py;
    sprites.push({x:e.x, y:e.y, dist:Math.hypot(ddx, ddy), enemy:e});
  }
  sprites.sort(function(a,b){ return b.dist - a.dist; });
  for (var si = 0; si < sprites.length; si++) drawSprite(sprites[si], horizon, colW, rayCount, zbuf);

  for (var bul = 0; bul < state.enemyBullets.length; bul++){
    var bb = state.enemyBullets[bul];
    var bdx2 = bb.x-state.px, bdy2 = bb.y-state.py;
    var bA = Math.atan2(bdy2, bdx2) - state.dir;
    while (bA > Math.PI) bA -= Math.PI*2;
    while (bA < -Math.PI) bA += Math.PI*2;
    if (Math.abs(bA) > state.fov) continue;
    var bC = Math.hypot(bdx2, bdy2)*Math.cos(bA);
    if (bC < 0.2) continue;
    var bSX = W/2 + Math.tan(bA)*(W/2)/Math.tan(state.fov/2);
    var colIdx = Math.floor(bSX/colW);
    if (colIdx >= 0 && colIdx < rayCount && zbuf[colIdx] < bC) continue;
    var bSize = Math.min(H*2, H/bC)*0.08;
    ctx.fillStyle = bb.color;
    ctx.beginPath(); ctx.arc(bSX, horizon, bSize, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(bSX, horizon, bSize*0.5, 0, Math.PI*2); ctx.fill();
  }

  for (var pi = 0; pi < state.particles.length; pi++){
    var p = state.particles[pi];
    var pdx = p.x-state.px, pdy = p.y-state.py;
    var pangle = Math.atan2(pdy, pdx) - state.dir;
    while (pangle > Math.PI) pangle -= Math.PI*2;
    while (pangle < -Math.PI) pangle += Math.PI*2;
    if (Math.abs(pangle) > state.fov) continue;
    var pcorr = Math.hypot(pdx, pdy)*Math.cos(pangle);
    if (pcorr < 0.2) continue;
    var col2 = Math.floor((W/2 + Math.tan(pangle)*(W/2)/Math.tan(state.fov/2))/colW);
    if (col2 >= 0 && col2 < rayCount && zbuf[col2] < pcorr) continue;
    var psize = Math.min(H*2, H/pcorr);
    var psx = W/2 + Math.tan(pangle)*(W/2)/Math.tan(state.fov/2);
    var psy = horizon + (H/pcorr)/2 - (p.z*H/pcorr);
    ctx.globalAlpha = Math.min(1, p.life/0.4);
    ctx.fillStyle = p.color;
    var sz2 = psize*p.size; if (sz2 < 1) sz2 = 1;
    ctx.fillRect(psx-sz2/2, psy-sz2/2, sz2, sz2);
    ctx.globalAlpha = 1;
  }

  drawGun();
  drawMinimap();

  if (state.headshotFlash > 0.05){
    ctx.fillStyle = 'rgba(255,220,80,' + (state.headshotFlash*0.15) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,220,80,' + Math.min(1, state.headshotFlash*2) + ')';
    ctx.font = 'bold ' + Math.floor(H*0.04) + 'px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('HEADSHOT!', W/2, H*0.3);
  }
}

function drawMinimap(){
  if (!state.map) return;
  var mmW = 140, mmH = 90;
  if (miniCv.width !== mmW || miniCv.height !== mmH){
    miniCv.width = mmW; miniCv.height = mmH;
    miniCv.style.width = mmW + 'px'; miniCv.style.height = mmH + 'px';
  }
  miniCtx.clearRect(0, 0, mmW, mmH);
  miniCtx.fillStyle = 'rgba(0,0,0,0.85)';
  miniCtx.fillRect(0, 0, mmW, mmH);
  var cell = Math.min((mmW - 8) / state.MAP_W, (mmH - 8) / state.MAP_H);
  var offX = (mmW - state.MAP_W * cell) / 2;
  var offY = (mmH - state.MAP_H * cell) / 2;
  for (var y = 0; y < state.MAP_H; y++){
    for (var x = 0; x < state.MAP_W; x++){
      if (state.map[y][x] === 1){
        miniCtx.fillStyle = '#666';
        miniCtx.fillRect(offX + x*cell, offY + y*cell, cell+0.5, cell+0.5);
      }
    }
  }
  for (var i = 0; i < state.enemies.length; i++){
    var en = state.enemies[i];
    if (!en.alive) continue;
    miniCtx.fillStyle = en.isBoss ? '#ff3344' : '#ff6666';
    miniCtx.fillRect(offX + en.x*cell - 1, offY + en.y*cell - 1, 3, 3);
  }
  miniCtx.fillStyle = '#ffcc00';
  miniCtx.fillRect(offX + state.px*cell - 2, offY + state.py*cell - 2, 4, 4);
  miniCtx.strokeStyle = '#ffcc00';
  miniCtx.lineWidth = 1;
  miniCtx.beginPath();
  miniCtx.moveTo(offX + state.px*cell, offY + state.py*cell);
  miniCtx.lineTo(offX + state.px*cell + Math.cos(state.dir)*cell*4, offY + state.py*cell + Math.sin(state.dir)*cell*4);
  miniCtx.stroke();
}

function hexToRgb(hex){ return [parseInt(hex.substr(1,2),16), parseInt(hex.substr(3,2),16), parseInt(hex.substr(5,2),16)]; }

function drawSprite(sp, horizon, colW, rayCount, zbuf){
  var dx = sp.x-state.px, dy = sp.y-state.py;
  var angle = Math.atan2(dy, dx) - state.dir;
  while (angle > Math.PI) angle -= Math.PI*2;
  while (angle < -Math.PI) angle += Math.PI*2;
  if (Math.abs(angle) > state.fov) return;
  var corrected = sp.dist * Math.cos(angle);
  if (corrected < 0.25) return;
  var e = sp.enemy;
  var scale = e.scale || 1;
  var sizeH = Math.min(H*2, H/corrected) * scale;
  var sizeW = sizeH * 0.72;
  var sX = W/2 + Math.tan(angle)*(W/2)/Math.tan(state.fov/2);
  var x0 = Math.floor(sX - sizeW/2), x1 = Math.floor(sX + sizeW/2);
  var yBot = Math.floor(horizon + (H/corrected)/2);
  var yTop = Math.floor(yBot - sizeH);
  var bob = Math.sin(e.wobble)*sizeH*0.02;
  var walkOff = e.frame === 0 ? 0 : sizeH*0.025;
  var startCol = Math.max(0, Math.floor(x0/colW));
  var endCol = Math.min(rayCount-1, Math.ceil(x1/colW));
  var skinRGB = hexToRgb(e.def.skin);
  var darkRGB = hexToRgb(e.def.dark);
  var bloodRGB = hexToRgb(e.def.blood || '#5a0808');
  var skinStyle = 'rgb(' + skinRGB[0] + ',' + skinRGB[1] + ',' + skinRGB[2] + ')';
  var darkStyle = 'rgb(' + darkRGB[0] + ',' + darkRGB[1] + ',' + darkRGB[2] + ')';
  var bloodStyle = 'rgb(' + bloodRGB[0] + ',' + bloodRGB[1] + ',' + bloodRGB[2] + ')';
  var eyeStyle = 'rgb(220,20,20)';
  var eyeGlint = '#ffaaaa';
  var whiteStyle = 'rgb(230,230,230)';
  var gunStyle = 'rgb(30,30,30)';

  for (var c = startCol; c <= endCol; c++){
    if (zbuf[c] < corrected) continue;
    var sx = c*colW, sw = colW+1;
    var uMid = ((sx+sw/2)-x0)/sizeW;
    if (uMid < 0 || uMid > 1) continue;

    // Arms reaching forward
    if (uMid > 0.02 && uMid < 0.22 && sizeH > 20){
      ctx.fillStyle = skinStyle;
      ctx.fillRect(sx, yTop + sizeH*0.30 + bob, sw, sizeH*0.09);
    }
    if (uMid > 0.78 && uMid < 0.98 && sizeH > 20){
      ctx.fillStyle = skinStyle;
      ctx.fillRect(sx, yTop + sizeH*0.30 + bob, sw, sizeH*0.09);
    }
    // Claws / hands
    if (uMid < 0.07 && sizeH > 25){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop + sizeH*0.28 + bob, sw, sizeH*0.16);
    }
    if (uMid > 0.93 && sizeH > 25){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop + sizeH*0.28 + bob, sw, sizeH*0.16);
    }

    // Head
    if (uMid > 0.28 && uMid < 0.72){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop + bob, sw, sizeH*0.05);
    }
    if (uMid > 0.22 && uMid < 0.78){
      ctx.fillStyle = skinStyle;
      ctx.fillRect(sx, yTop+sizeH*0.05+bob, sw, sizeH*0.19);
    }
    // Head shading
    if (uMid > 0.22 && uMid < 0.28){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop+sizeH*0.08+bob, sw, sizeH*0.14);
    }
    if (uMid > 0.72 && uMid < 0.78){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop+sizeH*0.08+bob, sw, sizeH*0.14);
    }
    // Sunken eyes with glow
    if (sizeH > 22){
      if (uMid > 0.30 && uMid < 0.40){
        ctx.fillStyle = eyeStyle;
        ctx.fillRect(sx, yTop+sizeH*0.13+bob, sw, sizeH*0.04);
      }
      if (uMid > 0.31 && uMid < 0.34 && sizeH > 32){
        ctx.fillStyle = eyeGlint;
        ctx.fillRect(sx, yTop+sizeH*0.13+bob, sw, sizeH*0.014);
      }
      if (uMid > 0.60 && uMid < 0.70){
        ctx.fillStyle = eyeStyle;
        ctx.fillRect(sx, yTop+sizeH*0.13+bob, sw, sizeH*0.04);
      }
      if (uMid > 0.66 && uMid < 0.69 && sizeH > 32){
        ctx.fillStyle = eyeGlint;
        ctx.fillRect(sx, yTop+sizeH*0.13+bob, sw, sizeH*0.014);
      }
    }
    // Open mouth with teeth
    if (uMid > 0.34 && uMid < 0.66 && sizeH > 30){
      ctx.fillStyle = '#000';
      ctx.fillRect(sx, yTop+sizeH*0.20+bob, sw, sizeH*0.035);
      if (sizeH > 45 && (c%3 === 0)){
        ctx.fillStyle = whiteStyle;
        ctx.fillRect(sx, yTop+sizeH*0.20+bob, sw, sizeH*0.022);
      }
    }
    // Blood on mouth
    if (uMid > 0.42 && uMid < 0.50 && sizeH > 35){
      ctx.fillStyle = bloodStyle;
      ctx.fillRect(sx, yTop+sizeH*0.225+bob, sw, sizeH*0.016);
    }

    // Torso - torn clothing
    if (uMid > 0.18 && uMid < 0.82){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yTop+sizeH*0.24+bob, sw, sizeH*0.33);
    }
    // Torn skin patches showing flesh
    if ((uMid > 0.30 && uMid < 0.44) || (uMid > 0.56 && uMid < 0.70)){
      ctx.fillStyle = skinStyle;
      ctx.fillRect(sx, yTop+sizeH*0.30+bob, sw, sizeH*0.16);
    }
    // Blood stain on chest
    if (uMid > 0.44 && uMid < 0.56 && sizeH > 30){
      ctx.fillStyle = bloodStyle;
      ctx.fillRect(sx, yTop+sizeH*0.36+bob, sw, sizeH*0.11);
    }
    // Ribs showing
    if (uMid > 0.32 && uMid < 0.42 && sizeH > 55){
      ctx.fillStyle = '#ddd';
      ctx.fillRect(sx, yTop+sizeH*0.32+bob, sw, sizeH*0.008);
      ctx.fillRect(sx, yTop+sizeH*0.37+bob, sw, sizeH*0.008);
    }

    // Gun for shooter
    if (e.hasGun && uMid > 0.72 && uMid < 0.92 && sizeH > 15){
      ctx.fillStyle = gunStyle;
      ctx.fillRect(sx, yTop+sizeH*0.30+bob, sw, sizeH*0.09);
      // Muzzle
      if (uMid > 0.88 && uMid < 0.92){
        ctx.fillStyle = '#555';
        ctx.fillRect(sx, yTop+sizeH*0.31+bob, sw, sizeH*0.03);
      }
    }

    // Legs (animated walking)
    if (uMid > 0.22 && uMid < 0.44){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yBot-sizeH*0.31+walkOff, sw, sizeH*0.31);
    }
    if (uMid > 0.56 && uMid < 0.78){
      ctx.fillStyle = darkStyle;
      ctx.fillRect(sx, yBot-sizeH*0.31-walkOff, sw, sizeH*0.31);
    }
    // Feet
    if (uMid > 0.20 && uMid < 0.46){
      ctx.fillStyle = '#1a1a10';
      ctx.fillRect(sx, yBot-sizeH*0.05, sw, sizeH*0.05);
    }
    if (uMid > 0.54 && uMid < 0.80){
      ctx.fillStyle = '#1a1a10';
      ctx.fillRect(sx, yBot-sizeH*0.05, sw, sizeH*0.05);
    }
  }
}

// BETTER PISTOL - First person view with hand
function drawGun(){
  if (state.currentWeapon === 'knife'){ drawKnife(); return; }

  var reloadOffset = 0;
  if (state.reloading){
    var pct = state.reloadTimer / WEAPONS.pistol.reloadTime;
    var phase = pct < 0.5 ? pct*2 : (1-pct)*2;
    reloadOffset = phase * H * 0.22;
  }

  var kick = state.pistolKick * 22;
  var bobX = Math.sin(state.bob) * 8;
  var bobY = Math.sin(state.bob * 2) * 4;

  var cx = W * 0.68 + bobX;
  var cy = H * 0.80 + kick + bobY + reloadOffset;
  var S = Math.min(W, H) * 0.10;

  ctx.save();
  ctx.translate(cx, cy);

  // ===== FOREARM (camouflage sleeve) =====
  ctx.fillStyle = '#2d4a24';
  ctx.beginPath();
  ctx.moveTo(S*1.4, S*3.0);
  ctx.lineTo(S*3.8, S*3.6);
  ctx.lineTo(S*3.8, S*7.5);
  ctx.lineTo(S*0.8, S*7.5);
  ctx.closePath();
  ctx.fill();
  // Camo pattern
  ctx.fillStyle = '#1f3518';
  ctx.fillRect(S*1.6, S*4.2, S*0.8, S*0.6);
  ctx.fillRect(S*2.8, S*4.8, S*0.7, S*0.5);
  ctx.fillRect(S*2.0, S*5.6, S*1.2, S*0.5);
  ctx.fillRect(S*3.2, S*6.0, S*0.5, S*0.6);

  // ===== HAND (gripping the pistol) =====
  // Palm/base
  ctx.fillStyle = '#c9a07a';
  ctx.beginPath();
  ctx.moveTo(S*1.6, S*2.0);
  ctx.lineTo(S*3.6, S*2.2);
  ctx.lineTo(S*3.8, S*3.8);
  ctx.lineTo(S*1.4, S*3.8);
  ctx.closePath();
  ctx.fill();
  // Fingers wrapping around grip
  ctx.fillStyle = '#c9a07a';
  for (var fg = 0; fg < 4; fg++){
    var fy = S*2.2 + fg*S*0.42;
    ctx.beginPath();
    ctx.moveTo(S*1.5, fy);
    ctx.lineTo(S*3.5, fy + S*0.06);
    ctx.lineTo(S*3.5, fy + S*0.32);
    ctx.lineTo(S*1.5, fy + S*0.36);
    ctx.closePath();
    ctx.fill();
    // Finger shadow/detail
    ctx.fillStyle = '#a88060';
    ctx.fillRect(S*1.5, fy + S*0.30, S*2.0, S*0.06);
    ctx.fillStyle = '#c9a07a';
  }
  // Thumb
  ctx.fillStyle = '#c9a07a';
  ctx.beginPath();
  ctx.ellipse(S*3.4, S*2.0, S*0.35, S*0.28, -0.4, 0, Math.PI*2);
  ctx.fill();
  // Thumb shadow
  ctx.fillStyle = '#a88060';
  ctx.beginPath();
  ctx.ellipse(S*3.5, S*2.15, S*0.20, S*0.14, -0.4, 0, Math.PI*2);
  ctx.fill();

  // ===== PISTOL - seen from first person, barrel forward-left =====
  // Rear of slide (closest to us)
  ctx.fillStyle = '#1a1a20';
  ctx.beginPath();
  ctx.moveTo(S*1.2, S*0.6);
  ctx.lineTo(S*3.0, S*0.4);
  ctx.lineTo(S*3.1, S*1.6);
  ctx.lineTo(S*1.2, S*1.8);
  ctx.closePath();
  ctx.fill();
  // Serrations on rear slide
  ctx.fillStyle = '#0a0a10';
  for (var ns = 0; ns < 6; ns++){
    ctx.fillRect(S*1.25, S*0.72 + ns*S*0.18, S*1.75, S*0.08);
  }
  // Slide top edge (lighter)
  ctx.fillStyle = '#3a3a42';
  ctx.beginPath();
  ctx.moveTo(S*1.2, S*0.6);
  ctx.lineTo(S*3.0, S*0.4);
  ctx.lineTo(S*3.05, S*0.6);
  ctx.lineTo(S*1.2, S*0.8);
  ctx.closePath();
  ctx.fill();

  // ===== BARREL going into the distance (up-left) =====
  ctx.fillStyle = '#2a2a32';
  ctx.beginPath();
  ctx.moveTo(S*1.0, S*0.6);
  ctx.lineTo(S*-0.8, S*-0.5);
  ctx.lineTo(S*-0.6, S*-1.0);
  ctx.lineTo(S*0.9, S*0.1);
  ctx.closePath();
  ctx.fill();
  // Top light edge of barrel
  ctx.fillStyle = '#5a5a62';
  ctx.beginPath();
  ctx.moveTo(S*1.0, S*0.6);
  ctx.lineTo(S*-0.8, S*-0.5);
  ctx.lineTo(S*-0.75, S*-0.72);
  ctx.lineTo(S*1.05, S*0.35);
  ctx.closePath();
  ctx.fill();
  // Bottom dark edge
  ctx.fillStyle = '#0a0a10';
  ctx.beginPath();
  ctx.moveTo(S*0.9, S*0.1);
  ctx.lineTo(S*-0.6, S*-1.0);
  ctx.lineTo(S*-0.55, S*-1.15);
  ctx.lineTo(S*1.0, S*-0.05);
  ctx.closePath();
  ctx.fill();

  // ===== MUZZLE (dark hole at the end of barrel) =====
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(S*-0.75, S*-0.75, S*0.28, S*0.15, -0.62, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = Math.max(1, S*0.06);
  ctx.beginPath();
  ctx.ellipse(S*-0.75, S*-0.75, S*0.28, S*0.15, -0.62, 0, Math.PI*2);
  ctx.stroke();

  // ===== FRONT SIGHT =====
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.ellipse(S*-0.60, S*-1.05, S*0.10, S*0.05, 0, 0, Math.PI*2);
  ctx.fill();

  // ===== REAR SIGHT =====
  ctx.fillStyle = '#1a1a20';
  ctx.fillRect(S*1.4, S*0.4, S*0.45, S*0.18);
  ctx.fillRect(S*2.1, S*0.4, S*0.45, S*0.18);

  // ===== TRIGGER GUARD (visible from below) =====
  ctx.strokeStyle = '#1a1a20';
  ctx.lineWidth = S*0.16;
  ctx.beginPath();
  ctx.moveTo(S*1.2, S*1.7);
  ctx.quadraticCurveTo(S*0.9, S*2.4, S*1.4, S*2.6);
  ctx.stroke();
  // Trigger
  ctx.strokeStyle = '#0a0a10';
  ctx.lineWidth = S*0.08;
  ctx.beginPath();
  ctx.moveTo(S*1.2, S*1.8);
  ctx.quadraticCurveTo(S*1.0, S*2.2, S*1.2, S*2.4);
  ctx.stroke();

  // ===== GRIP (angled down) =====
  ctx.fillStyle = '#1a1a20';
  ctx.beginPath();
  ctx.moveTo(S*1.4, S*1.7);
  ctx.lineTo(S*3.1, S*1.5);
  ctx.lineTo(S*3.9, S*3.6);
  ctx.lineTo(S*2.1, S*3.8);
  ctx.closePath();
  ctx.fill();
  // Grip texture (cross-hatch)
  ctx.fillStyle = '#0a0a10';
  for (var gh = 0; gh < 4; gh++){
    ctx.fillRect(S*2.0, S*2.0 + gh*S*0.35, S*1.6, S*0.08);
  }

  // ===== SLIDE DETAIL - ejection port =====
  ctx.fillStyle = '#0a0a10';
  ctx.fillRect(S*0.8, S*0.55, S*0.5, S*0.4);

  // ===== HIGHLIGHT along slide =====
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(S*1.15, S*0.68, S*1.8, S*0.06);

  // ===== MUZZLE FLASH =====
  if (state.muzzleFlash > 0.05){
    var mf = state.muzzleFlash;
    var fx = S*-0.8, fy2 = S*-0.8;
    var R = S * 3.2 * mf;
    var grd = ctx.createRadialGradient(fx, fy2, 0, fx, fy2, R);
    grd.addColorStop(0, 'rgba(255,250,210,' + (mf*0.98) + ')');
    grd.addColorStop(0.35, 'rgba(255,200,80,' + (mf*0.85) + ')');
    grd.addColorStop(0.7, 'rgba(255,120,20,' + (mf*0.5) + ')');
    grd.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(fx, fy2, R, 0, Math.PI*2); ctx.fill();
    // Core
    ctx.fillStyle = 'rgba(255,255,220,' + mf + ')';
    ctx.beginPath();
    ctx.moveTo(fx + R*0.15, fy2 + R*0.30);
    ctx.lineTo(fx - R*0.9, fy2 - R*0.6);
    ctx.lineTo(fx + R*0.35, fy2 - R*0.45);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawKnife(){
  var kW = Math.min(W * 0.22, 200);
  var bobX = Math.sin(state.bob)*6;
  var swing = state.pistolKick;
  var rot = swing * 0.6 - 0.25;
  var kx = W * 0.72 + bobX;
  var ky = H * 0.82 + Math.sin(state.bob)*4 + swing*30;

  ctx.save();
  ctx.translate(kx, ky);
  ctx.rotate(rot);

  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-kW*0.045, kW*0.05, kW*0.09, kW*0.30);
  ctx.fillStyle = '#2a1a0a';
  for (var h = 0; h < 4; h++) ctx.fillRect(-kW*0.05, kW*0.08 + h*kW*0.07, kW*0.10, kW*0.02);
  ctx.fillStyle = '#8a7a3a';
  ctx.beginPath(); ctx.arc(0, kW*0.07, kW*0.035, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5a4a1a';
  ctx.beginPath(); ctx.arc(0, kW*0.07, kW*0.018, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-kW*0.12, kW*0.02, kW*0.24, kW*0.035);

  ctx.fillStyle = '#d8e2ec';
  ctx.beginPath();
  ctx.moveTo(-kW*0.055, 0);
  ctx.lineTo(-kW*0.075, -kW*0.10);
  ctx.lineTo(-kW*0.06, -kW*0.35);
  ctx.quadraticCurveTo(-kW*0.02, -kW*0.65, kW*0.05, -kW*0.85);
  ctx.lineTo(kW*0.075, -kW*0.88);
  ctx.quadraticCurveTo(kW*0.09, -kW*0.65, kW*0.075, -kW*0.35);
  ctx.lineTo(kW*0.055, -kW*0.08);
  ctx.lineTo(kW*0.055, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#8a96a4';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -kW*0.85);
  ctx.lineTo(kW*0.075, -kW*0.88);
  ctx.quadraticCurveTo(kW*0.09, -kW*0.65, kW*0.075, -kW*0.35);
  ctx.lineTo(kW*0.055, -kW*0.08);
  ctx.lineTo(kW*0.055, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.moveTo(-kW*0.01, -kW*0.10);
  ctx.lineTo(-kW*0.005, -kW*0.78);
  ctx.lineTo(kW*0.015, -kW*0.78);
  ctx.lineTo(kW*0.010, -kW*0.10);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ===== RAF LOOP WITH GUARD (fixes speed bug) =====
var lastTime = 0;
var loopRunning = false;
function mainLoop(t){
  if (!loopRunning) return;
  var dt = Math.min(0.05, (t - lastTime)/1000 || 0.016);
  lastTime = t;
  if (state.running || state.dead || state.won){
    update(dt);
    if (state.map) render();
    requestAnimationFrame(mainLoop);
  } else {
    loopRunning = false;
  }
}
function startLoop(){
  if (loopRunning) return;
  loopRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(mainLoop);
}

initBgMusic();
resize();
renderLevelGrid();
showMenu();
})();
