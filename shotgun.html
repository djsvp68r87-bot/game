<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shotgun Test</title>
<style>
  html,body{margin:0;padding:0;background:#000;width:100vw;height:100vh;overflow:hidden;position:fixed;top:0;left:0}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', {alpha:false});
var W = 0, H = 0;

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.floor(window.innerWidth * dpr);
  H = cv.height = Math.floor(window.innerHeight * dpr);
  cv.style.width = window.innerWidth + 'px';
  cv.style.height = window.innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
  draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

function draw(){
  var ceilGrad = ctx.createLinearGradient(0, 0, 0, H/2);
  ceilGrad.addColorStop(0, '#3a3a4a');
  ceilGrad.addColorStop(1, '#5a5a6a');
  ctx.fillStyle = ceilGrad;
  ctx.fillRect(0, 0, W, H/2);

  var floorGrad = ctx.createLinearGradient(0, H/2, 0, H);
  floorGrad.addColorStop(0, '#4a4a52');
  floorGrad.addColorStop(1, '#6a6a72');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H/2, W, H/2);

  drawShotgun();
}

function drawShotgun(){
  // ===== SHOTGUN viewed from BEHIND - looking down the barrel =====
  // Anchor: bottom center (slightly right)
  var S = Math.min(W, H) * 0.10;
  var anchorX = W * 0.55;
  var anchorY = H * 1.0;

  ctx.save();
  ctx.translate(anchorX, anchorY);

  // ============ STOCK (bottom, closest to us - wide, narrows upward) ============
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath();
  ctx.moveTo(-S*2.2, S*0.3);
  ctx.lineTo(S*2.2, S*0.3);
  ctx.lineTo(S*1.8, -S*1.2);
  ctx.lineTo(-S*1.8, -S*1.2);
  ctx.closePath();
  ctx.fill();
  // Wood grain vertical stripes
  ctx.fillStyle = '#3a2410';
  for (var g = 0; g < 5; g++){
    var gx = -S*1.8 + g*S*0.75;
    ctx.fillRect(gx, S*0.3, S*0.12, S*1.4);
  }
  // Butt plate (bottom edge, rubber)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-S*2.2, S*0.15, S*4.4, S*0.35);
  // Butt plate detail lines
  ctx.fillStyle = '#0a0a0a';
  for (var bp = 0; bp < 8; bp++){
    ctx.fillRect(-S*2.0 + bp*S*0.5, S*0.2, S*0.06, S*0.25);
  }

  // ============ RECEIVER (middle - box shape, narrower) ============
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.moveTo(-S*1.5, -S*1.2);
  ctx.lineTo(S*1.5, -S*1.2);
  ctx.lineTo(S*1.3, -S*2.6);
  ctx.lineTo(-S*1.3, -S*2.6);
  ctx.closePath();
  ctx.fill();
  // Top edge highlight
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-S*1.3, -S*2.6, S*2.6, S*0.12);
  // Side highlights
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(-S*1.5, -S*2.6, S*0.15, S*1.4);
  ctx.fillRect(S*1.35, -S*2.6, S*0.15, S*1.4);
  // Ejection port (dark hole on right side)
  ctx.fillStyle = '#050505';
  ctx.fillRect(S*0.7, -S*2.0, S*0.5, S*0.35);
  // Receiver top surface (lighter - we see it from above/behind slightly)
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.moveTo(-S*1.3, -S*2.6);
  ctx.lineTo(S*1.3, -S*2.6);
  ctx.lineTo(S*1.1, -S*2.8);
  ctx.lineTo(-S*1.1, -S*2.8);
  ctx.closePath();
  ctx.fill();

  // ============ BARREL (top - long, narrows upward into distance) ============
  ctx.fillStyle = '#1e1e1e';
  ctx.beginPath();
  ctx.moveTo(-S*0.7, -S*2.6);
  ctx.lineTo(S*0.7, -S*2.6);
  ctx.lineTo(S*0.45, -S*6.2);
  ctx.lineTo(-S*0.45, -S*6.2);
  ctx.closePath();
  ctx.fill();
  // Top highlight strip
  ctx.fillStyle = '#3e3e3e';
  ctx.beginPath();
  ctx.moveTo(-S*0.55, -S*2.6);
  ctx.lineTo(S*0.15, -S*2.6);
  ctx.lineTo(S*0.1, -S*6.2);
  ctx.lineTo(-S*0.35, -S*6.2);
  ctx.closePath();
  ctx.fill();
  // Left edge shadow
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(-S*0.7, -S*2.6);
  ctx.lineTo(-S*0.5, -S*2.6);
  ctx.lineTo(-S*0.3, -S*6.2);
  ctx.lineTo(-S*0.45, -S*6.2);
  ctx.closePath();
  ctx.fill();

  // Magazine tube (thinner, below barrel, seen from front/back - two tubes)
  // Actually in this angle the tube is directly below, hidden. Just show top.

  // ============ FRONT SIGHT (top of barrel, small dot) ============
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.arc(0, -S*6.0, S*0.13, 0, Math.PI*2);
  ctx.fill();
  // Sight base
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-S*0.15, -S*5.9, S*0.3, S*0.15);

  // ============ MUZZLE (very top of barrel - dark opening) ============
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, -S*6.2, S*0.42, S*0.10, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = S*0.04;
  ctx.beginPath();
  ctx.ellipse(0, -S*6.2, S*0.42, S*0.10, 0, 0, Math.PI*2);
  ctx.stroke();
  // Inner rim highlight
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.ellipse(0, -S*6.18, S*0.32, S*0.06, 0, 0, Math.PI*2);
  ctx.fill();
  // Inner hole
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, -S*6.18, S*0.20, S*0.04, 0, 0, Math.PI*2);
  ctx.fill();

  // ============ REAR SIGHT (on receiver top, small) ============
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-S*0.35, -S*2.85, S*0.15, S*0.15);
  ctx.fillRect(S*0.2, -S*2.85, S*0.15, S*0.15);

  // ============ LEFT ARM (comes from bottom-left) ============
  ctx.fillStyle = '#2d4a24';
  ctx.beginPath();
  ctx.moveTo(-S*4.5, S*1.2);
  ctx.lineTo(-S*1.6, S*0.3);
  ctx.lineTo(-S*1.3, -S*1.0);
  ctx.lineTo(-S*1.6, -S*1.3);
  ctx.lineTo(-S*3.0, -S*0.5);
  ctx.lineTo(-S*4.5, S*0.3);
  ctx.closePath();
  ctx.fill();
  // Camo stripes on left arm
  ctx.fillStyle = '#1f3518';
  ctx.beginPath();
  ctx.moveTo(-S*3.8, S*0.5);
  ctx.lineTo(-S*2.4, -S*0.1);
  ctx.lineTo(-S*2.2, -S*0.4);
  ctx.lineTo(-S*3.6, S*0.2);
  ctx.closePath();
  ctx.fill();

  // ============ RIGHT ARM (comes from bottom-right) ============
  ctx.fillStyle = '#2d4a24';
  ctx.beginPath();
  ctx.moveTo(S*4.5, S*1.2);
  ctx.lineTo(S*1.6, S*0.3);
  ctx.lineTo(S*1.3, -S*1.0);
  ctx.lineTo(S*1.6, -S*1.3);
  ctx.lineTo(S*3.0, -S*0.5);
  ctx.lineTo(S*4.5, S*0.3);
  ctx.closePath();
  ctx.fill();
  // Camo stripes on right arm
  ctx.fillStyle = '#1f3518';
  ctx.beginPath();
  ctx.moveTo(S*3.8, S*0.5);
  ctx.lineTo(S*2.4, -S*0.1);
  ctx.lineTo(S*2.2, -S*0.4);
  ctx.lineTo(S*3.6, S*0.2);
  ctx.closePath();
  ctx.fill();

  // ============ LEFT HAND (on forend/pump, mid-height) ============
  // Palm
  ctx.fillStyle = '#c9a07a';
  ctx.beginPath();
  ctx.ellipse(-S*1.5, -S*1.5, S*0.4, S*0.35, 0, 0, Math.PI*2);
  ctx.fill();
  // Fingers wrapping from left
  for (var f = 0; f < 4; f++){
    ctx.beginPath();
    ctx.ellipse(-S*1.5 + f*S*0.18, -S*1.75 - f*S*0.02, S*0.12, S*0.28, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // Thumb on top
  ctx.beginPath();
  ctx.ellipse(-S*1.5, -S*1.15, S*0.25, S*0.15, 0.3, 0, Math.PI*2);
  ctx.fill();

  // ============ RIGHT HAND (on trigger grip) ============
  ctx.fillStyle = '#c9a07a';
  ctx.beginPath();
  ctx.ellipse(S*1.5, -S*1.5, S*0.4, S*0.35, 0, 0, Math.PI*2);
  ctx.fill();
  // Fingers wrapping from right
  for (var f2 = 0; f2 < 4; f2++){
    ctx.beginPath();
    ctx.ellipse(S*1.5 - f2*S*0.18, -S*1.75 - f2*S*0.02, S*0.12, S*0.28, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // Thumb on top
  ctx.beginPath();
  ctx.ellipse(S*1.5, -S*1.15, S*0.25, S*0.15, -0.3, 0, Math.PI*2);
  ctx.fill();

  // ============ SHADOWS under hands ============
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(-S*1.5, -S*1.2, S*0.4, S*0.1, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(S*1.5, -S*1.2, S*0.4, S*0.1, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

resize();
})();
</script>
</body>
</html>
