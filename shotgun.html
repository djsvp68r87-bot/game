<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shotgun Test</title>
<style>
  html,body{margin:0;padding:0;background:#000;width:100vw;height:100vh;overflow:hidden;position:fixed;top:0;left:0}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', {alpha:false});
var W = 0, H = 0;

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.floor(window.innerWidth * dpr);
  H = cv.height = Math.floor(window.innerHeight * dpr);
  cv.style.width = window.innerWidth + 'px';
  cv.style.height = window.innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
  draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

function draw(){
  var ceilGrad = ctx.createLinearGradient(0, 0, 0, H/2);
  ceilGrad.addColorStop(0, '#3a3a4a');
  ceilGrad.addColorStop(1, '#5a5a6a');
  ctx.fillStyle = ceilGrad;
  ctx.fillRect(0, 0, W, H/2);

  var floorGrad = ctx.createLinearGradient(0, H/2, 0, H);
  floorGrad.addColorStop(0, '#4a4a52');
  floorGrad.addColorStop(1, '#6a6a72');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H/2, W, H/2);

  drawShotgun();
}

function drawShotgun(){
  var S = Math.min(W, H) * 0.11;

  // ===== Anchor: bottom-right corner =====
  var cx = W * 0.72;
  var cy = H * 0.98;

  ctx.save();
  ctx.translate(cx, cy);

  // Angle: barrel points forward into screen (up-left), so rotate slightly
  ctx.rotate(-0.08);

  // ===== FOREARM (coming from bottom-right) =====
  ctx.fillStyle = '#2d4a24';
  ctx.beginPath();
  ctx.moveTo(S*1.4, S*0.8);
  ctx.lineTo(S*4.0, S*1.3);
  ctx.lineTo(S*4.0, S*5.0);
  ctx.lineTo(S*0.8, S*4.0);
  ctx.closePath();
  ctx.fill();
  // Camo stripes
  ctx.fillStyle = '#1f3518';
  ctx.beginPath();
  ctx.moveTo(S*1.8, S*1.8);
  ctx.lineTo(S*3.6, S*2.2);
  ctx.lineTo(S*3.6, S*2.7);
  ctx.lineTo(S*1.6, S*2.3);
  ctx.closePath();
  ctx.fill();

  // ===== STOCK (wooden, behind receiver, goes right) =====
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath();
  ctx.moveTo(S*1.6, S*0.3);
  ctx.lineTo(S*3.4, S*0.7);
  ctx.lineTo(S*3.7, S*2.4);
  ctx.lineTo(S*1.7, S*2.1);
  ctx.closePath();
  ctx.fill();
  // Wood grain
  ctx.fillStyle = '#3a2410';
  ctx.beginPath();
  ctx.moveTo(S*1.9, S*0.9);
  ctx.lineTo(S*3.5, S*1.2);
  ctx.lineTo(S*3.6, S*1.7);
  ctx.lineTo(S*1.9, S*1.5);
  ctx.closePath();
  ctx.fill();
  // Butt plate
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(S*3.4, S*0.7);
  ctx.lineTo(S*4.1, S*0.9);
  ctx.lineTo(S*4.4, S*2.6);
  ctx.lineTo(S*3.7, S*2.4);
  ctx.closePath();
  ctx.fill();

  // ===== RECEIVER (main body) =====
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, -S*0.3);
  ctx.lineTo(S*1.7, S*0.3);
  ctx.lineTo(S*1.7, S*2.3);
  ctx.lineTo(-S*0.3, S*1.6);
  ctx.closePath();
  ctx.fill();
  // Top highlight
  ctx.fillStyle = '#4a4a4a';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, -S*0.3);
  ctx.lineTo(S*1.7, S*0.3);
  ctx.lineTo(S*1.7, S*0.5);
  ctx.lineTo(-S*0.2, -S*0.1);
  ctx.closePath();
  ctx.fill();
  // Ejection port
  ctx.fillStyle = '#050505';
  ctx.fillRect(S*0.8, S*0.35, S*0.55, S*0.35);
  // Slide-action bar
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-S*0.1, S*1.0, S*1.8, S*0.18);

  // ===== TRIGGER GUARD =====
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = S*0.12;
  ctx.beginPath();
  ctx.moveTo(S*0.15, S*1.8);
  ctx.quadraticCurveTo(-S*0.1, S*2.5, S*0.6, S*2.5);
  ctx.stroke();
  // Trigger
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(S*0.2, S*1.85);
  ctx.quadraticCurveTo(S*0.15, S*2.25, S*0.4, S*2.3);
  ctx.lineTo(S*0.5, S*2.25);
  ctx.quadraticCurveTo(S*0.3, S*2.05, S*0.35, S*1.85);
  ctx.closePath();
  ctx.fill();

  // ===== BARREL (extends forward into screen, up-left) =====
  ctx.fillStyle = '#1e1e1e';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, -S*0.3);
  ctx.lineTo(-S*2.6, -S*1.5);
  ctx.lineTo(-S*2.6, -S*0.7);
  ctx.lineTo(-S*0.2, S*0.2);
  ctx.closePath();
  ctx.fill();
  // Top highlight
  ctx.fillStyle = '#3e3e3e';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, -S*0.3);
  ctx.lineTo(-S*2.6, -S*1.5);
  ctx.lineTo(-S*2.6, -S*1.3);
  ctx.lineTo(-S*0.2, -S*0.1);
  ctx.closePath();
  ctx.fill();
  // Bottom shadow
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, S*0.2);
  ctx.lineTo(-S*2.6, -S*0.7);
  ctx.lineTo(-S*2.6, -S*0.55);
  ctx.lineTo(-S*0.2, S*0.35);
  ctx.closePath();
  ctx.fill();

  // ===== TUBE MAGAZINE =====
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, S*0.3);
  ctx.lineTo(-S*2.2, -S*0.5);
  ctx.lineTo(-S*2.2, -S*0.2);
  ctx.lineTo(-S*0.2, S*0.6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.moveTo(-S*0.2, S*0.3);
  ctx.lineTo(-S*2.2, -S*0.5);
  ctx.lineTo(-S*2.2, -S*0.4);
  ctx.lineTo(-S*0.2, S*0.4);
  ctx.closePath();
  ctx.fill();

  // ===== PUMP / FOREND (wooden, in middle-left) =====
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath();
  ctx.moveTo(-S*1.2, -S*0.6);
  ctx.lineTo(-S*2.2, -S*1.0);
  ctx.lineTo(-S*2.3, -S*0.1);
  ctx.lineTo(-S*1.2, S*0.3);
  ctx.closePath();
  ctx.fill();
  // Pump ridges
  ctx.fillStyle = '#3a2410';
  for (var g = 0; g < 5; g++){
    var gx = -S*1.25 - g*S*0.21;
    ctx.beginPath();
    ctx.moveTo(gx, -S*0.55 - g*S*0.08);
    ctx.lineTo(gx - S*0.06, -S*0.55 - g*S*0.08);
    ctx.lineTo(gx - S*0.06, S*0.25 - g*S*0.08);
    ctx.lineTo(gx, S*0.25 - g*S*0.08);
    ctx.closePath();
    ctx.fill();
  }
  // Pump front edge highlight
  ctx.fillStyle = '#7a5a2a';
  ctx.beginPath();
  ctx.moveTo(-S*1.2, -S*0.6);
  ctx.lineTo(-S*2.2, -S*1.0);
  ctx.lineTo(-S*2.2, -S*0.9);
  ctx.lineTo(-S*1.2, -S*0.5);
  ctx.closePath();
  ctx.fill();

  // ===== HAND on pump =====
  ctx.fillStyle = '#c9a07a';
  for (var f = 0; f < 4; f++){
    var fx = -S*1.25 - f*S*0.25;
    var fy = -S*0.5;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx - S*0.1, fy + S*0.1);
    ctx.lineTo(fx - S*0.1, fy + S*0.45);
    ctx.lineTo(fx, fy + S*0.55);
    ctx.lineTo(fx + S*0.2, fy + S*0.45);
    ctx.lineTo(fx + S*0.2, fy + S*0.1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#a88060';
    ctx.fillRect(fx - S*0.05, fy + S*0.05, S*0.22, S*0.06);
    ctx.fillStyle = '#c9a07a';
  }
  // Thumb on top of pump
  ctx.beginPath();
  ctx.ellipse(-S*1.4, -S*0.65, S*0.3, S*0.16, 0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#a88060';
  ctx.beginPath();
  ctx.ellipse(-S*1.45, -S*0.65, S*0.14, S*0.08, 0.2, 0, Math.PI*2);
  ctx.fill();

  // ===== REAR SIGHT =====
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(S*1.3, -S*0.15, S*0.15, S*0.25);

  // ===== FRONT BEAD =====
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.arc(-S*2.5, -S*1.35, S*0.08, 0, Math.PI*2);
  ctx.fill();

  // ===== MUZZLE =====
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(-S*2.6, -S*1.1, S*0.11, S*0.28, -0.55, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = S*0.05;
  ctx.beginPath();
  ctx.ellipse(-S*2.6, -S*1.1, S*0.11, S*0.28, -0.55, 0, Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

resize();
})();
</script>
</body>
</html>
